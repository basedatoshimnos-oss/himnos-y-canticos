.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);background:rgba(23,57,87,.65);font-weight:900;white-space:nowrap}.chip.active{color:var(--gold);border-color:rgba(231,185,87,.6);background:rgba(231,185,87,.16)}.hymn{display:flex;gap:12px;align-items:center;cursor:pointer}.num{min-width:54px;height:48px;border-radius:16px;background:linear-gradient(135deg,#123a5e,#173957);display:grid;place-items:center;font-weight:900}.title{font-weight:900;line-height:1.2}.meta{font-size:12px;color:var(--muted);margin-top:4px}button{font-family:inherit}.btn{border:0;border-radius:16px;padding:12px 14px;background:var(--gold);color:#171005;font-weight:900;cursor:pointer}.btn.secondary{background:#123a5e;color:var(--cream);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.res{min-height:86px;text-align:left;background:linear-gradient(135deg,#173957,#0e2e4b);border:1px solid var(--line);border-radius:22px;color:var(--cream);padding:14px;font-weight:900}.res small{display:block;color:var(--muted);font-weight:700;margin-top:4px}.audio,video,iframe{width:100%;border-radius:18px;border:1px solid var(--line);background:#061a2d}video{max-height:240px}iframe{height:520px}.lyric{white-space:pre-wrap;font-size:var(--reader,20px);line-height:1.55;font-weight:650;background:rgba(255,246,225,.06);padding:16px;border-radius:20px;border:1px solid rgba(255,246,225,.1)}.chorus{background:rgba(231,185,87,.14);border-color:rgba(231,185,87,.45)}.section-title{margin:18px 0 10px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.fade{animation:fade .24s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);background:rgba(23,57,87,.65);font-weight:900;white-space:nowrap}.chip.active{color:var(--gold);border-color:rgba(231,185,87,.6);background:rgba(231,185,87,.16)}.hymn{display:flex;gap:12px;align-items:center;cursor:pointer}.num{min-width:54px;height:48px;border-radius:16px;background:linear-gradient(135deg,#123a5e,#173957);display:grid;place-items:center;font-weight:900}.title{font-weight:900;line-height:1.2}.meta{font-size:12px;color:var(--muted);margin-top:4px}button{font-family:inherit}.btn{border:0;border-radius:16px;padding:12px 14px;background:var(--gold);color:#171005;font-weight:900;cursor:pointer}.btn.secondary{background:#123a5e;color:var(--cream);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.res{min-height:86px;text-align:left;background:linear-gradient(135deg,#173957,#0e2e4b);border:1px solid var(--line);border-radius:22px;color:var(--cream);padding:14px;font-weight:900}.res small{display:block;color:var(--muted);font-weight:700;margin-top:4px}.audio,video,iframe{width:100%;border-radius:18px;border:1px solid var(--line);background:#061a2d}video{max-height:240px}iframe{height:520px}.lyric{white-space:pre-wrap;font-size:var(--reader,20px);line-height:1.55;font-weight:650;background:rgba(255,246,225,.06);padding:16px;border-radius:20px;border:1px solid rgba(255,246,225,.1)}.chorus{background:rgba(231,185,87,.14);border-color:rgba(231,185,87,.45)}.section-title{margin:18px 0 10px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.fade{animation:fade .24s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px;border:1px solid var(--line)}.player{background:linear-gradient(145deg,#174d78,#0b2944 60%,#071a2c);text-align:center}.cover{width:156px;height:156px;border-radius:30px;margin:12px auto 16px;display:grid;place-items:center;font-size:78px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(231,185,87,.17));border:1px solid rgba(231,185,87,.32);box-shadow:0 18px 42px rgba(0,0,0,.25)}.transport{display:flex;align-items:center;justify-content:space-evenly;margin-top:8px}.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#123a5e;color:var(--cream);font-size:21px}.round.play{width:66px;height:66px;background:var(--gold);color:#171005;border:0;font-size:29px}.progress{width:100%;accent-color:var(--gold)}.playlist-strip{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}.playlist{min-width:154px;min-height:126px;text-align:left;border:1px solid var(--line);border-radius:22px;padding:14px;background:linear-gradient(145deg,#173957,#0e2e4b);color:var(--cream)}.playlist.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.playlist-icon{font-size:32px;display:block;margin-bottom:22px}.mini{min-height:auto;padding:10px 12px}.queue-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}

<script>
const HYMNS = [{"id":"hyc_revision_nuevo_001","bookId":"hyc_revision","number":"N.1","title":"Oh Dios, tu amor hoy nos congrega","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh Dios, tu amor hoy nos congrega en torno a Cristo, en unidad;\nse unen labios que celebran tu plan de amor y gran bondad\n\nCoro:\n¡Gloria a tu nombre, nuestro Padre!\n¡Gloria a tu inefable amor!\nSobre la tierra tus hijos te exalten mientras esperan el glorioso albor.\n\n2. ¡Oh, qué misterio de la gracia!\nya desde la eternidad\nnos diste, oh Dios de amor y ciencia,\nlugar en tu felicidad.\n\n3. Oh Padre, tu amor supremo\ndescanso al fin encontrará\ncuando tú veas en el cielo\na los salvados, en tu hogar.\n\n4. En Cristo tú nos has colmado\nde gloria, luz, riqueza y paz;\npronto él vendrá con voz de mando,\ny junto a él nos llevará.\n\n5. Oh Dios, a ti nos inclinamos\nal contemplar tan grande amor;\ncon el Espíritu clamamos:\n¡envía pronto al Salvador!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.001%20-%20Oh%20Dios%2C%20tu%20amor%20hoy%20nos%20congrega.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.1.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.1.mp4"},{"id":"hyc_revision_nuevo_002","bookId":"hyc_revision","number":"N.2","title":"¡Qué pensamiento tan incomparable!","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Qué pensamiento tan incomparable, oh Dios, surgió en tu corazón de amor!\nCristo y la Iglesia, ¡misterio insondable!\nElla, la esposa, y él, su Señor.\n\n2. Mente humana no concebiría\ndesignios tan gloriosos de amor.\nSabiduría y gracia en armonía,\nantes del mundo y su fundación.\n\n3. La Iglesia dada a tu amado Hijo,\nsu plenitud por siempre ella será.\nMuy pronto en gloria junto a Jesucristo,\nla esposa del Cordero allí estará.\n\n4. Con gratitud, oh Dios, te adoramos,\npues en tu gracia nos das el gustar\naún desde ahora, el gozo de tus atrios,\ndonde con Cristo hemos de morar.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.002%20-%20%C2%A1Qu%C3%A9%20pensamiento%20tan%20incomparable%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.2.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.2.mp4"},{"id":"hyc_revision_nuevo_003","bookId":"hyc_revision","number":"N.3","title":"Oh Padre, ¡cuán precioso es","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh Padre, ¡cuán precioso es tu Hijo a tu corazón!, tu amado, tu bendito y fiel, en quien tú ves la perfección.\n\n2. Tu unigénito aquí\ntu gloria y tu amor mostró;\nal Dios que nadie vio jamás,\nel Hijo nos lo reveló.\n\n3. Cuando él anduvo en este erial,\namó el hacer tu voluntad;\nsu vida, su delicia fue\nservirte con fidelidad.\n\n4. Sumiso y consagrado a ti\ntambién fue cuando en cruz murió;\ntan solo en obediencia a ti,\namándonos, su vida dio.\n\n5. Aquí en la tierra te exaltó,\ntu obra hizo, siempre fiel;\ny tú, que aprecias su valor,\ntambién le has exaltado a él.\n\n6. Sentado a tu diestra está:\nla más gloriosa exaltación;\ntu gozo y tu reposo es él,\ny nuestra suma bendición.\n\n7. ¡Oh, cuán precioso es para ti!\nPodemos solo adorar,\ny en su hermosura sin igual\ntu propia gloria contemplar.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.003%20-%20Oh%20Padre%2C%20%C2%A1cu%C3%A1n%20precioso%20es.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.3.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.3.mp4"},{"id":"hyc_revision_nuevo_004","bookId":"hyc_revision","number":"N.4","title":"Oh Padre y Dios, tu Hijo es","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh Padre y Dios, tu Hijo es para ti tu gozo eterno y tu satisfacción, por su perfecto caminar aquí, por lo que hallaste en su corazón.\n\n2. Oh Padre y Dios, ¡qué amor y lealtad\npudiste en tu santo Hijo ver!\nNo vino a hacer su propia voluntad;\ntu obra y tus deseos quiso hacer.\n\n3. Oh Padre y Dios, ¡qué gran satisfacción:\nhallar un solo hombre que te amó\ncon toda su alma, mente y corazón,\ny que en su vida en todo te agradó!\n\n4. Oh Padre y Dios, tu honra él te dio;\nen medio de rebelde humanidad\nJesús tan solo para ti vivió,\nconforme a tu divina dignidad.\n\n5. Oh Padre y Dios, por puro amor a ti\nJesús sufrió afrenta y confusión;\nllevó tus vituperios sobre sí;\nel celo por su Dios le consumió.\n\n6. Oh Padre y Dios, ¡qué amor mostró por ti\nsu propia salvación no te pidió,\nmas, en su angustia y su tristeza aquí,\nla gloria de tu nombre anheló.\n\n7. Oh Padre y Dios, así te amó Jesús;\nni aun su propia vida escatimó,\npues por tu honor la derramó en la cruz;\nsin mancha, a sí mismo se ofreció.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.004%20-%20Oh%20Padre%20y%20Dios%2C%20tu%20Hijo%20es.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.4.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.4.mp4"},{"id":"hyc_revision_nuevo_005","bookId":"hyc_revision","number":"N.5","title":"Oh Padre y Dios, ¡qué gozo es para ti","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh Padre y Dios ¡qué gozo es para ti el sacrificio excelso de Jesús!\nOro precioso fue probado allí, en la aflicción horrenda de la cruz.\n\n2. Oh Padre y Dios, en medio del dolor,\ndesamparado en densa oscuridad,\nél solo quiso vindicar tu honor\ny hacer resplandecer tu santidad.\n\n3. Oh Padre y Dios, ¡qué gloria para ti\nla fe tan grande que él en ti mostró!:\nAun al verse abandonado allí,\nde tu fidelidad jamás dudó.\n\n4. Oh Padre y Dios, aunque él clamó a ti\ny tú no respondiste a su voz,\npidió que nadie, viendo al justo así,\npor ello desconfiase de su Dios.\n\n5. Oh Padre y Dios; ninguno como él\nen tus promesas hasta el fin confió:\nsabiendo que tú eres siempre fiel,\nal dar su vida, a ti se encomendó.\n\n6. Oh Padre y Dios, Jesús te amó a ti;\ntal como lo mereces, él te honró;\nte complació, te satisfizo aqui,\ny gloria eterna para ti compró.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.005%20-%20Oh%20Padre%20y%20Dios%2C%20%C2%A1qu%C3%A9%20gozo%20es%20para%20ti.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.5.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.5.mp4"},{"id":"hyc_revision_nuevo_006","bookId":"hyc_revision","number":"N.6","title":"¿Qué ofrecerte, oh Dios?","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¿Qué ofrecerte, oh Dios, o qué don presentar?\npues todo es tuyo ya, nada te falta a ti;\nel nombre de Jesús podemos exaltar, el Hijo de tu amor, tu fiel testigo aquí.\n\n2. Tu humilde servidor, oh Padre, junto a ti,\nlos planes de tu amor haciendo en perfección.\nCercano nuestro fue, más tan distinto en sí:\nun hombre celestial, mostrando compasión.\n\n3. Tu corazón, oh Dios, vio cuando él se entregó;\nclavado en cruenta cruz y allí permaneció.\nSufriendo gran dolor, sumiso, en ti confió;\nhaciendo la expiación, tu gloria restauró.\n\n4. Tu Hijo contemplar, ¡qué gozo es para ti!\ny tu amor por él nos llena el corazón.\nTodo es de ti, oh Dios; por ti y para ti.\n¡Cuán grande eres tú! ¡A ti la adoración!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.006%20-%20%C2%BFQu%C3%A9%20ofrecerte%2C%20oh%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.6.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.6.mp4"},{"id":"hyc_revision_nuevo_007","bookId":"hyc_revision","number":"N.7","title":"Señor, tú te encarnaste","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Señor, tú te encarnaste, tomaste humanidad, y así nos revelaste la gracia y la verdad.\n\n2. Bendito por los siglos,\nel Dios de la creación,\nviniste como un niño,\n¡qué humilde condición!\n\n3. Por donde has caminado\nel bien hiciste tú;\ntu vida, así, ha agradado\nal Padre en plenitud.\n\n4. Tú fuiste extranjero;\ndel cielo, embajador;\nmas en un cruel madero\nel hombre te colgó.\n\n5. Tu vida santa, oh Cristo,\nperfumes exhaló;\nmas en tu sacrificio\n¡fragante olor subió!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.007%20-%20Se%C3%B1or%2C%20t%C3%BA%20te%20encarnaste.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.7.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.7.mp4"},{"id":"hyc_revision_nuevo_008","bookId":"hyc_revision","number":"N.8","title":"¡Oh Salvador! hoy contemplamos","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Oh Salvador!, hoy contemplamos tu senda humilde aquí, perfecta, siempre a tu Padre agradando, ¡qué vida santa, fiel y recta!\n\n2. Tú fuiste el «Hombre de dolores»;\nen el quebranto has caminado;\nen este mundo de aflicciones,\ntú fuiste en todo sin pecado.\n\n3. Tomando aquí el lugar del Siervo,\nla forma humana revestiste;\nfuiste en la tierra extranjero,\ncansancio y sed aquí sentiste.\n\n4. El Hijo eterno siempre fuiste,\nmas, como hombre, en tu experiencia,\npor todo lo que padeciste,\naquí aprendiste la obediencia.\n\n5. Te vemos en tu agonía:\npostrado en tierra, allí en el huerto;\nruegos y súplicas subían\n—¡huestes te ven con desconcierto!—\n\n6. Jesús, tu cruz hoy recordamos;\ntu sangre allí se ha derramado\npara limpiarnos del pecado\ny así la vida eterna darnos.\n\n7. Por fe te vemos exaltado\ny coronado allá en el cielo;\nde corazón hoy proclamamos:\n¡tú eres digno, oh Cordero!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.008%20-%20%C2%A1Oh%20Salvador%21%20hoy%20contemplamos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.8.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.8.mp4"},{"id":"hyc_revision_nuevo_009","bookId":"hyc_revision","number":"N.9","title":"Hijo de Dios, en ti habita","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Hijo de Dios, en ti habita la plenitud de la Deidad.\nTú has revelado, en tu vida, de Dios amor con claridad.\nPor tu Palabra fue formado el universo con poder.\ny tu grandeza así ha mostrado al Dios de luz y del saber.\n\n2. Hijo del Padre, que en su seno siempre estuviste en su amor;\nuno con él, su fiel reflejo, antes de toda creación.\nMas tú quisiste —¡qué misterio!— a este mundo descender,\npara sufrir el vituperio y por nosotros padecer.\n\n3. Hombre divino, tú mostraste gracia y amor, Señor Jesús.\nEl sufrimiento tú probaste, desde el pesebre hasta la cruz;\nfuiste extranjero y despreciado, solo enfrentaste tu aflicción,\ny en el huerto has aceptado copa de juicio y amargor.\n\n4. Oh tú, Cordero inmolado, manso, sufriste en la cruz;\nbajo el juicio del pecado que sobre ti cayó, oh Jesús.\nAdoración, loor y gloria fluye hacia ti de corazón.\n¡Coros de amor y alegría suban por siempre a ti, Señor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.009%20-%20Hijo%20de%20Dios%2C%20en%20ti%20habita.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.9.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.9.mp4"},{"id":"hyc_revision_nuevo_010","bookId":"hyc_revision","number":"N.10","title":"¡Oh, Hijo muy amado!","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Oh, Hijo muy amado, sostén de la creación!\nEl mundo tú formaste con toda perfección.\nExacta imagen eres del Dios de amor y luz, y todo su deleite tiene en ti, Jesús.\n\n2. «Jesús», precioso nombre de tu humanidad,\nperfecta y sin mancha, tan llena de bondad.\nCordero sin defecto, tú fuiste, oh Jesús:\nperfume agradable se elevó en la cruz.\n\n3. En Gólgota te vemos, colgado en cruz allí;\nel peso del pecado fue impuesto sobre ti.\nTinieblas te rodearon en tu gran aflicción;\npor Dios desamparado, y hecho maldición.\n\n4. Adoración y gloria te damos, Salvador;\ny nuestros corazones hoy arden por tu amor.\nQuedamos admirados al ver la magnitud\nde lo que tú hiciste, oh Señor Jesús.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.010%20-%20%C2%A1Oh%2C%20Hijo%20muy%20amado%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.10.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.10.mp4"},{"id":"hyc_revision_nuevo_011","bookId":"hyc_revision","number":"N.11","title":"Cordero santo","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Cordero santo, ¿quién entiende tu amoroso corazón?\nAl cruel madero ¿O quién el gran dolor comprende que soportaste en sumisión?\ntú anduviste, como un cordero hacia el altar;\n¡qué horrenda carga tú sufriste por todo nuestro mal obrar!\n\n2. De la maldad aquí rodeado, mas consagrado a tu Dios,\ntu vida en sacrificio has dado, que solo a él glorificó;\nsu amor en cruz tú revelaste, su gracia inmensa, su bondad;\ndolor y escarnio soportaste, cumpliendo allí su voluntad.\n\n3. Sufriste tú el furor divino; la maldición en ti cayó.\nNosotros, libres del castigo, sin culpa, sin ningún temor.\nTu vida diste por salvarnos —¡oh grande, incomprensible amor!—;\naun el morir nos es ganancia, el juicio ya no da temor.\n\n4. Justicia plena tú alcanzaste, que satisface al santo Dios;\ncual Sumo Sacerdote entraste al cielo, donde él te exaltó.\nCordero santo, que en el trono el gozo eres del Señor,\na ti y al Padre adoramos, cantando tu eternal loor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.011%20-%20Cordero%20santo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.11.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.11.mp4"},{"id":"hyc_revision_nuevo_012","bookId":"hyc_revision","number":"N.12","title":"Oh, qué solemne día","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Oh, qué solemne día! ¡El sol se oscureció!\nEl Padre de las luces su rostro escondió.\nPues en un monte, alzado en una cruz central, Jesús, tú te encontrabas cargando nuestro mal.\n\n2. Herido fuiste, oh Cristo, en nuestra posición;\nsufriste la vergüenza, la ira y aflicción.\nTres horas insondables de honda oscuridad,\nen las que soportaste el juicio en soledad.\n\n3. Jesús, Señor amado, ¿quién puede comprender\nel Gólgota y tus horas de intenso padecer?\nDios solo lo entiende en toda su extensión;\n— su corazón encuentra en ti satisfacción.\n\n4. Con gozo te adoramos, bendito Salvador;\ntu obra ha desplegado justicia y amor.\nYa no reinan tinieblas en nuestro corazón,\npues tú has consumado eterna salvación.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.012%20-%20Oh%2C%20qu%C3%A9%20solemne%20d%C3%ADa.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.12.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.12.mp4"},{"id":"hyc_revision_nuevo_013","bookId":"hyc_revision","number":"N.13","title":"Te Vemos en Gólgota","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Te vemos en Gólgota, oh Salvador, cargando tu cruz con firmeza y valor;\nsubiendo al Gólgota con sumisión, tu amor desplegaste y tu corazón.\n\n2. En Gólgota, hecho por Dios maldición,\n¡oh tú, el Cordero de la expiación!,\nel peso del juicio en ti recayó;\ntu sangre preciosa así nos compró.\n\n3. Te vemos en Gólgota, sobre el altar;\nallí te ofreciste, sin mancha ni mal.\nRecuerdo eterno habrá, oh Jesús,\ndel Gólgota donde moriste en la cruz.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.013%20-%20Te%20Vemos%20en%20G%C3%B3lgota.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.13.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.13.mp4"},{"id":"hyc_revision_nuevo_014","bookId":"hyc_revision","number":"N.14","title":"Contemplándote, Jesús","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Contemplándote, Jesús, en tu refulgente gloria, hoy, postrados, te adoramos: tú, de Dios el resplandor.\nTu corona celestial nos recuerda la historia de tu cruz, de su vergüenza, de tu angustia y tu dolor.\n\n2. A la afrenta contra ti, al desprecio más profundo,\na la espina en tu frente y al suplicio abrumador,\na ese odio y trato cruel que sufriste de este mundo,\n¡te responde tu corona: la del Hombre vencedor!\n\n3. Solo, y en aquella cruz, por tu Dios desamparado\nno hubo un alma compasiva ni respuesta a tu clamor.\nHoy en gloria, oh Cristo, estás, por el Padre exaltado;\ntu alabanza ya resuena en los cielos con fervor.\n\n4. Si el justo y santo Dios, en aquella amarga hora,\naún siendo el Hijo amado, de ti el rostro ocultó;\nsi aquí tu hermosa faz fue por hombres maltratada,\nhoy podemos ver en ella, todo el esplendor de Dios.\n\n5. Al mirar tu rostro así, toda el alma te adora;\nSalvador Jesús, precioso, es tu nombre sin igual.\n¡A ti, honra y poder en el cielo y en la tierra!\nTú, el Cordero, eres digno de alabanza universal.\n\n6. Suba el cántico sin fin: ¡sea al Padre eterna gloria!\nYa en la tierra ha comenzado la incesante adoración;\nllenos del divino amor —de la gracia es la victoria—,\n¡gloria al Padre, gloria al Hijo!, canta nuestro corazón.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.014%20-%20Contempl%C3%A1ndote%2C%20Jes%C3%BAs.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.14.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.14.mp4"},{"id":"hyc_revision_nuevo_015","bookId":"hyc_revision","number":"N.15","title":"Queremos anunciar tu muerte","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Queremos anunciar tu muerte, oh Jesús;\nsentados hoy aquí, con gozo y en tu paz.\nCargaste nuestro mal en tu cuerpo, en la cruz;\nlo recordamos al comer de este pan.\n\n2. La copa que nos das nos lleva a meditar\nque había que pagar por nuestra redención:\nTu sangre, oh Jesús, fue el precio eficaz\nque nos libró de culpa y de condenación.\n\n3. Dejaste, Salvador, los símbolos de amor\npor compañía fiel de tu Iglesia acá;\npor siglos hasta hoy han estado, Señor,\ncomo testigos de tu gran fidelidad.\n\n4. Muy pronto pasará el tiempo terrenal;\nla copa y el pan aquí se quedarán,\npues los reemplazará tu presencia y tu paz.\n¡Oh, ven, Señor, a tu Iglesia a buscar!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.015%20-%20Queremos%20anunciar%20tu%20muerte.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.15.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.15.mp4"},{"id":"hyc_revision_nuevo_016","bookId":"hyc_revision","number":"N.16","title":"Reunidos a tu mesa","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Reunidos a tu mesa a expresar tu gran amor, recordamos tus tristezas, anunciamos tu valor, y unánimes alzamos nuestra voz a ti, Señor: Oh Jesús, ven a buscarnos, te esperamos, Salvador.\n\n2. Anhelamos ver tu rostro, y tu voz allá escuchar,\nhabitar en tu presencia y tu imagen reflejar.\nOh, Señor, la esposa clama: «Ven, preséntanos a ti,\ny en tu célica morada tennos siempre junto a ti.»","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.016%20-%20Reunidos%20a%20tu%20mesa.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.16.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.16.mp4"},{"id":"hyc_revision_nuevo_017","bookId":"hyc_revision","number":"N.17","title":"¡Cumplida está la laboriosa obra!","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Cumplida está la laboriosa obra!\nDios justo es, y ha vindicado su honra por su Hijo, quien clamó con fuerte voz: «¡Cumplido está!, ¡Cumplido está!»\n\n2. ¡Cumplida está la salvación eterna!\nHan sido quebrantadas las cadenas;\ntriunfó el amor de Dios allá en la cruz:\n¡Cumplido está, cumplido está!\n\n3. «¡Cumplido está!» será el canto eterno;\nlos salvos por la sangre del Cordero\npor siempre adoraremos a Jesús,\nquien proclamó: «¡Cumplido está!»","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.017%20-%20%C2%A1Cumplida%20est%C3%A1%20la%20laboriosa%20obra%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.17.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.17.mp4"},{"id":"hyc_revision_nuevo_018","bookId":"hyc_revision","number":"N.18","title":"Señor, al cielo has ascendido","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Señor, al cielo has ascendido, en gloria has sido recibido;\nmas tú regresarás muy pronto a establecer aquí tu trono.\nExhibirás corona de honor, digna de ti, ¡oh Cristo vencedor!\n\n2. Tú reinarás con paz y gloria,\ntras obtener tu gran victoria.\nTú, como Rey, serás honrado;\nbatalla y guerra habrán cesado.\nVara de hierro en tu mano habrá,\njusticia plena tu reino tendrá.\n\n3. Loores subirán al cielo,\na Dios, el Santo y Supremo;\npor medio tuyo, como ofrenda,\ny así ensalzar su gloria eterna.\nPor siempre Sacerdote tú serás,\nRey de justicia y también de paz.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.018%20-%20Se%C3%B1or%2C%20al%20cielo%20has%20ascendido.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.18.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.18.mp4"},{"id":"hyc_revision_nuevo_019","bookId":"hyc_revision","number":"N.19","title":"Comprados, libres y hechos santos","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Comprados, libres y hechos santos, ya tuyos somos, oh Jesús;\noh, ¿quién podía amarnos tanto, pagando el precio, si no tú?\n\n2. Oh, ¿qué palabra bastaría\ndel poderoso Creador?\npues el Dios justo exigía\ntu sacrificio, ¡oh Redentor!\n\n3. Mas desde el cielo no podías\ncumplir la eterna redención;\nal Gólgota tú mismo irías,\ntu cruz cargando en sumisión.\n\n4. Señor, hoy toma nuestra vida,\nen culto de adoración.\nEn cruz sufriste tú la herida:\n¡oh, cuánto has hecho, Salvador!\n\n5. Y cuando en el cielo estemos\neternamente, oh Señor,\ntu sacrificio sondearemos\ny te daremos nuestro amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.019%20-%20Comprados%2C%20libres%20y%20hechos%20santos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.19.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.19.mp4"},{"id":"hyc_revision_nuevo_020","bookId":"hyc_revision","number":"N.20","title":"¡Cristo viene!","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¡Cristo viene, y dejaremos este vano mundo atrás! Cara a cara lo veremos; todo peso pasará.\n\n2. ¡Cristo viene con gran gozo!\nGozo puro y celestial,\ntal que solo en su reposo\nlo podremos disfrutar.\n\n3. ¡Cristo viene a nuestro encuentro!\nJunto a él nos llevará,\ny será por siempre el centro\nde alabanza eterna allá.\n\n4. ¡Cristo viene, y el fruto\nde su aflicción verá!\nY el recuerdo de los suyos,\nel Calvario allí será.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.020%20-%20%C2%A1Cristo%20viene%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.20.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.20.mp4"},{"id":"hyc_revision_nuevo_021","bookId":"hyc_revision","number":"N.21","title":"La vista levantamos","type":"Nuevo","topic":"Sin clasificar","lyric":"1. La vista levantamos al trono celestial;\npor fe, allí miramos al que es a Dios igual.\nUn Hombre exaltado en gloria divinal a quien el Padre ha dado la majestad real.\n\n2. Quedamos admirados al ver a Cristo allí;\npues siempre recordamos que, en este mundo vil,\nlos hombres lo clavaron en esa horrible cruz,\nnegaron y mataron al santo y buen Jesús.\n\n3. Resucitó glorioso, no vio la corrupción;\nJesús, el Victorioso, al cielo ascendió.\nEs digno de alabanza, honor y adoración,\ny, pronto, sin tardanza, vendrá con salvación.\n\n4. En el hogar amado, en el que Cristo está,\nsu pueblo rescatado por siempre alabará;\ncantando la historia de la encarnación,\nla cruz tan meritoria, la plena redención.\n\n5. Tenemos garantía de que al feliz lugar,\nquien en Jesús confía un día llegará;\ncon título adquirido por él, el Fiador,\nel cual fue conseguido en cruz de gran dolor.\n\n6. Loemos y adoremos a nuestro Salvador,\ny siempre procuremos, guiados por su amor,\ndel mundo separados, por él aquí vivir,\ny, siempre consagrados, su voluntad cumplir.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.021%20-%20La%20vista%20levantamos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.21.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.21.mp4"},{"id":"hyc_revision_nuevo_022","bookId":"hyc_revision","number":"N.22","title":"Apocalipsis 1:6","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Al que nos ama y nos ha lavado de nuestros pecados en su sangre, y nos ha hecho un reino, sacerdotes para su Dios y Padre, a él sea la gloria y el poder por los siglos de los siglos. Amén, amén.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.022%20-%20Apocalipsis%2016.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.22.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.22.mp4"},{"id":"hyc_revision_nuevo_023","bookId":"hyc_revision","number":"N.23","title":"Donde en tu nombre has congregado","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Donde en tu nombre has congregado a dos o tres, si no son más, Señor, nos has asegurado que en medio de ellos tú estás.\nNo es el número la esencia;\naunque haya grande multitud, tan solo es por tu presencia que hay bendiciones y virtud.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.023%20-%20Donde%20en%20tu%20nombre%20has%20congregado.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.23.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.23.mp4"},{"id":"hyc_revision_nuevo_024","bookId":"hyc_revision","number":"N.24","title":"Sentados a tus pies, Señor Jesús","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Sentados a tus pies, Señor Jesús, ¡no hay mejor lugar en cual estar!\nPon en nosotros gran solicitud: tu dulce voz queremos escuchar.\n\n2. La buena parte haznos disfrutar,\n—¡en tu presencia hay amor y luz!—;\npues tu Palabra hemos de escuchar\ncon diligencia. ¡Danos tu quietud!\n\n3. Somos discípulos, Señor Jesús,\nhaznos más fieles al seguirte a ti,\ny mayordomos que, con gratitud,\nse gozan más en «dar que recibir.»\n\n4. Alumbra el camino con tu luz,\npor tu Espíritu obra con amor;\nque hacedores seamos, Jesús,\nde tu Palabra con total fervor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.024%20-%20Sentados%20a%20tus%20pies%2C%20Se%C3%B1or%20Jes%C3%BAs.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.24.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.24.mp4"},{"id":"hyc_revision_nuevo_025","bookId":"hyc_revision","number":"N.25","title":"¿A quién iremos, Señor?","type":"Nuevo","topic":"Sin clasificar","lyric":"1. ¿A quién iremos, Señor?\n¡Tú tienes palabras de vida eterna!\ny nosotros hemos creído, y sabemos que tú eres el Santo de Dios. Señor Jesús, ¡Tú eres nuestro Dios!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.025%20-%20%C2%BFA%20qui%C3%A9n%20iremos%2C%20Se%C3%B1or.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.25.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.25.mp4"},{"id":"hyc_revision_nuevo_026","bookId":"hyc_revision","number":"N.26","title":"Yo sé una cosa","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Yo sé una cosa que me hace feliz: que, naciendo ciego, veo ahora al fin.\nLleno estoy de gozo: ¡Cristo me salvó!\nYo lo amo, pues primero él me amó.\n\n2. Solo una cosa necesaria es,\ny es la buena parte: estar a sus pies.\nDulce es su Palabra y su comunión,\ny al estar en su presencia hay bendición.\n\n3. Una cosa hago, sin tener temor:\nprosigo a la meta, tras mi Precursor.\nDejo atrás las dudas, penas y aflicción;\nfuerza tengo cuando Cristo es mi visión.\n\n4. Cada día quiero con Jesús vivir,\nver sus hermosuras y su voz oír,\ndescubrir sus glorias y gustar su amor.\n¡Esta oración elevo a mi Señor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.026%20-%20Yo%20s%C3%A9%20una%20cosa.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.26.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.26.mp4"},{"id":"hyc_revision_nuevo_027","bookId":"hyc_revision","number":"N.27","title":"Es por la gracia que yo vivo","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Es por la gracia que yo vivo, oh mi Señor, pues tú por mí en cruz moriste — ¡inmenso amor.\nSeguro y firme en esta roca ahora estoy;\nalegre y libre, por tu muerte, camino hoy.\n\n2. Es en tu gracia que me enseñas, Señor Jesús,\ny por tu Espíritu me guías con clara luz.\nVoy caminando hacia el cielo, al dulce hogar,\njunto a tu lado, con confianza y firme andar.\n\n3. Es de tu gracia que yo hablo al pecador.\n¡Oh, haz, Señor, que a ti se postren al ver tu amor!\nY al proclamar las buenas nuevas de salvación,\nhaz que te escuchen y reciban tu bendición.\n\n4. Es con tu gracia que camino con firme pie;\nno entiendo todo lo que pasa, mas confiaré.\nSi se derrumba el presente, me abrazas tú;\ncon tu amor aquí me envuelves, ¡oh mi Jesús!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.027%20-%20Es%20por%20la%20gracia%20que%20yo%20vivo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.27.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.27.mp4"},{"id":"hyc_revision_nuevo_028","bookId":"hyc_revision","number":"N.28","title":"Su gracia es mayor si las cargas aumentan","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Su gracia es mayor si las cargas aumentan, su fuerza es mayor si la prueba es más cruel;\nsi es grande la lucha, mayores su gracia;\nsi hay hondas tristezas mayor es su paz.\n\nCoro:\nSu amor no termina, su gracia no acaba, no hay límite para el poder del Señor;\npues en sus inmensas riquezas en gloria abundan sus dones, abunda su amor.\n\n2. Si nuestros recursos se han agotado,\nsi faltan las fuerzas para continuar,\nsi estamos a punto de desanimarnos,\nel tiempo ha llegado en que Dios ha de obrar.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.028%20-%20Su%20gracia%20es%20mayor%20si%20las%20cargas%20aumentan.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.28.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.28.mp4"},{"id":"hyc_revision_nuevo_029","bookId":"hyc_revision","number":"N.29","title":"Cuán precioso es andar en tus huellas","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Cuán precioso es andar en tus huellas, Señor y estar a tus pies escuchando tu voz;\ntu discípulo ser, habitando en tu amor.\n¡Hoy instrúyeme, Salvador!\n\n2. En mi diario vivir quiero manifestar\nque contigo he estado, oh mi Salvador\nrecibiendo de ti, enseñanza y favor,\nque me guía en mi andar.\n\n3. Dame oídos Señor, que te sepan oír\ny una lengua que pueda a otros hablar\nsobre tu obra en la cruz y tu gracia sin par,\nreflejándote en mi vivir.\n\n4. Y quizás vaya hoy en camino a Emaús\ncon tristeza, desánimo y necesidad,\npero allí también tú, a mi lado estás,\nrestaurándome, oh Jesús.\n\n5. Tú me amaste, oh Jesús, te entregaste por mí,\nmuerto estoy mas tú vives en mí, oh Señor\nPor la gracia de Dios, por la fe vivo yo,\nsostenido por él aquí.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.029%20-%20Cu%C3%A1n%20precioso%20es%20andar%20en%20tus%20huellas.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.29.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.29.mp4"},{"id":"hyc_revision_nuevo_030","bookId":"hyc_revision","number":"N.30","title":"Oh alma mía, en Cristo estás segura","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh alma mía, en Cristo estás segura;\nél te ha salvado ya tu lado está.\nEn el dolor, la prueba y la amargura, su tierno amor refugio te dará.\nÉl, en la prueba forja su figura;\nsu semejanza en ti él formará.\n\n2. En Cristo está tu paz y tu confianza;\nsolo en sus brazos hay tranquilidad.\nÉl te ha cuidado en toda circunstancia,\nsiempre ha mostrado su fidelidad.\nEl Salvador te guía con constancia;\nél solo calma toda tempestad.\n\n3. Descansa, oh alma, pues Dios no te olvida;\nmuy pronto volverá el Salvador.\nEntenderás, entonces que en tu vida\ndolor obró según su gran amor.\nTu fe lo honre y sea a él rendida;\nél solo es digno, pues es tu Señor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.030%20-%20Oh%20alma%20m%C3%ADa%2C%20en%20Cristo%20est%C3%A1s%20segura.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.30.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.30.mp4"},{"id":"hyc_revision_nuevo_031","bookId":"hyc_revision","number":"N.31","title":"Oh Padre, te complace oír","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Oh Padre, te complace oír cuando a ti oramos afán y pesos quitas tú cuando contigo hablamos.\nTú solo sabes darnos paz, brindarnos fiel consuelo;\npues solo tú nos das quietud, disipas todo miedo.\n\n2. Y si la senda incierta es, otorgas esperanza,\nreposo a los cansados das, tu gracia sola basta.\nEntregas fuerza y virtud, lo débil haces fuerte;\nsabiduría das también, ¡transformas nuestra suerte!\n\n3. Y si la prueba arrecia hoy, ¡oh Dios de toda gracia!,\ntenemos la seguridad que en bendición la cambias.\nLa imagen quieres conformar en nos de tu Hijo amado,\ny todo guías para el bien de los que tú has salvado.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.031%20-%20Oh%20Padre%2C%20te%20complace%20o%C3%ADr.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.31.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.31.mp4"},{"id":"hyc_revision_nuevo_032","bookId":"hyc_revision","number":"N.32","title":"Tal como soy, yo vengo a ti","type":"Nuevo","topic":"Sin clasificar","lyric":"1. Tal como soy, yo vengo a ti, pues tú por mí fuiste a morir y tú me invitas a venir\n\nCoro:\nSeñor Jesús, yo vengo a ti.\n\n2. Tal como soy, sin demorar,\npues tú mi mal podrás quitar,\ny toda mancha vil borrar\n\n3. Tal como soy, me acogerás;\nperdón, limpieza me darás;\ny porque creo que lo harás\n\n4. Tal como soy, tu inmenso amor\nvenció ya todo mi temor.\nSer tuyo quiero, oh mi Señor,\ny así Jesús, yo vengo a ti.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/N.032%20-%20Tal%20como%20soy%2C%20yo%20vengo%20a%20ti.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/N.32.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/N.32.mp4"},{"id":"hyc_revision_revisado_001","bookId":"hyc_revision","number":"1","title":"Oh Padre, a ti te adoramos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Oh Padre, a ti te adoramos;\ngran Dios, inmortal, encumbrado, lo llenas todo con tu esplendor.\nEn tu presencia reunidos, tus santos, por gracia elegidos, alaban tu nombre y tu amor.\n\nCoro:\n¡A ti supremo loor, potente Creador! ¡Aleluya!\n¡Gloria y honor, Dios Salvador! ¡Aleluya! ¡Aleluya!\n\n2. Del rostro tuyo la gloria ¡oh Padre de luz, Dios de gracia!\nya en Jesús nos iluminó.\nTu pueblo, libre y salvado, te alaba, oh Dios, por tu Amado,\nel Hijo que aquí te complació.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/001%20-%20Oh%20Padre%2C%20a%20ti%20te%20adoramos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/1.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/1.mp4"},{"id":"hyc_revision_revisado_002","bookId":"hyc_revision","number":"2","title":"¡Oh, gran Dios! de amor y gracia","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Oh, gran Dios!, de amor y gracia lleno está tu corazón.\nEn el cielo mismo entramos hoy, a darte adoración.\nDe tu amor ya somos hijos, escogidos en Jesús;\nrescatados, muy amados, santa posesión en luz.\n\n2. ¡Qué glorioso es, como hijos, al Dios fuerte contemplar;\ndel que en cruz sufrió la muerte la victoria celebrar!\nTu familia aquí reunida bajo tu mirada fiel,\nen tu Hijo bendecida, puesta aparte sólo en él.\n\n3. ¡Cuánta gracia, Padre amado, conocer así tu amor\nesperando ver en gloria a tu Hijo, el Salvador!\n¡Viene pronto: sumo gozo! ¡canta, Iglesia del Señor!\nde tu Redentor glorioso mostrarás el esplendor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/002%20-%20%C2%A1Oh%2C%20gran%20Dios%21%20de%20amor%20y%20gracia.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/2.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/2.mp4"},{"id":"hyc_revision_revisado_003","bookId":"hyc_revision","number":"3","title":"Ante ti, bendito Padre","type":"Revisado","topic":"Sin clasificar","lyric":"1. Ante ti, bendito Padre, en tu celestial hogar hemos de morar con Cristo, quien nos preparó lugar;\n¡cuán profundos pensamientos de divina bendición!\ntan preciosos, solo emanan de tu propio corazón.\n\n2. En el Hijo amado aceptos, Padre santo, tú nos das\nel lugar de cercanía ante tu bendita faz;\njunto a Cristo conocemos de tu gloria el esplendor;\ny por él tú nos mostraste las riquezas de tu amor.\n\n3. Mas supremo gozo el tuyo: el designio de tu amor\nse ha cumplido en tu Amado para tu eternal loor;\nmuchos hijos hoy te adoran en espíritu y verdad.\n¡Te alabamos, nuestro Padre, por tu amor y gran bondad!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/003%20-%20Ante%20ti%2C%20bendito%20Padre.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/3.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/3.mp4"},{"id":"hyc_revision_revisado_004","bookId":"hyc_revision","number":"4","title":"Bendito hogar, hogar de Dios","type":"Revisado","topic":"Sin clasificar","lyric":"1. Bendito hogar, hogar de Dios, descansa allí su amor.\n¿Qué más podría contentar al santo del Señor? Es nuestro hogar;\npaterno amor nos llena el corazón: el Primogénito de Dios comparte su porción.\n\n2. ¡Oh, qué hogar! solo Jesús comprende ese amor,\ny, como amados, él nos trae a dar al Padre loor;\nmora en el seno paternal y puede comprender\nsu corazón, el cual nos da con gozo a conocer.\n\n3. ¡Oh, qué hogar! eterno amor inunda aquel lugar;\ndivino amor del Hijo allí lo llena a rebosar.\nContestación el Padre da y pruebas de su amor;\nno hay nube alguna oscura allá, ni sombra de dolor.\n\n4. ¡Oh, qué hogar! Tal es su amor, que él nos ha de llevar\na estar allí, su gloria ver, con él participar;\nporque en el Hijo el Padre dio su corazón, su hogar;\nsomos objetos de su amor, y él nuestro gozo allá.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/004%20-%20Bendito%20hogar%2C%20hogar%20de%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/4.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/4.mp4"},{"id":"hyc_revision_revisado_005","bookId":"hyc_revision","number":"5","title":"Por ti, oh Dios, llamados","type":"Revisado","topic":"Sin clasificar","lyric":"1. Por ti, oh Dios, llamados al Hijo a contemplar, quien tu obra ha consumado, buscándote agradar.\n¡Tesoro tan preciado, del seno paternal!\nTu amor nos ha salvado, ¡oh, gracia eternal!\n\n2. Con gozo contemplamos, ¡oh celestial favor!,\nal Padre amando al Hijo con un excelso amor;\ndivina complacencia se halla en un varón:\nel Hijo satisface del Padre el corazón.\n\n3. Jesús, a͑ún rechazado del mundo pecador,\npor Dios es coronado de gloria y de honor;\nquien, de la cruz horrenda, sufrió la maldición,\nhoy, centro en luz eterna, recibe adoración.\n\n4. Cantar de amor resuena doquier con gran fervor,\nse eleva por el Hijo al Padre en su loor;\nes grande el regocijo, es puro y eternal,\npues llenan los salvados la casa paternal.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/005%20-%20Por%20ti%2C%20oh%20Dios%2C%20llamados.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/5.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/5.mp4"},{"id":"hyc_revision_revisado_006","bookId":"hyc_revision","number":"6","title":"La gloria eterna de tu gracia","type":"Revisado","topic":"Sin clasificar","lyric":"1. La gloria eterna de tu gracia, ¡oh Dios!, en luz, tu Iglesia alaba en alta voz;\nen el Amado nos diste bendición, aceptos, frutos de la redención.\n\n2. Nos escogiste desde la eternidad\nen tu Hijo amado, y fue tu voluntad\nsiempre tenernos cual hijos en tu amor,\nsantos, sin mancha a tu eterno loor.\n\n3. Con paz y gracia, gozo y bienes sin par,\nquisiste ¡oh Padre! a tus hijos colmar;\ny cielo y tierra por siempre has de reunir\nen Cristo y todo por él bendecir.\n\n4. ¡Oh Dios! gozamos del Espíritu el don,\npor ti sellados, tu santa posesión,\ncon el Amado, Autor de nuestro bien,\ngloria te damos por siempre, ¡Amén!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/006%20-%20La%20gloria%20eterna%20de%20tu%20gracia.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/6.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/6.mp4"},{"id":"hyc_revision_revisado_007","bookId":"hyc_revision","number":"7","title":"¡Oh Padre!, en la asamblea","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Oh Padre!, en la asamblea te espera adoración de hijos que conocen tu amante corazón.\nY si ante ti se elevan loores en canción, es para celebrarte por tu inefable don.\n\n2. Llamándonos de muerte a vida eternal,\ntu gracia nos ha hecho un pueblo celestial.\nLa sangre del Amado nos llena de virtud;\ntu Espíritu los bienes derrama en plenitud.\n\n3. Reales sacerdotes, Dios, somos ante ti;\ntambién coherederos del Hijo tuyo allí.\nNos hizo sus hermanos, con él un cuerpo ya,\ny como a él nos amas cual tu familia acá.\n\n4. ¡Oh Padre!, te alabamos por tanta bendición;\npor tu Hijo elevamos la grata adoración.\nLo vemos exaltado, triunfante y vencedor,\nviendo en su faz, sin velo, tus glorias en amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/007%20-%20%C2%A1Oh%20Padre%21%2C%20en%20la%20asamblea.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/7.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/7.mp4"},{"id":"hyc_revision_revisado_008","bookId":"hyc_revision","number":"8.1","title":"Padre, ¡gran Dios de amor!","type":"Revisado","topic":"Sin clasificar","lyric":"1. Padre, ¡gran Dios de amor!\nque reveló el Señor, ¡a ti loor!\nDel seno paternal, el puro manantial fluye vida eternal. ¡Gloria al Dios de amor!\n\n2. Por nuestro Redentor,\nel Hijo de tu amor, ¡a ti loor!\nSu vida entregó, su sangre nos lavó\ny el cielo nos abrió. ¡Gloria al Dios de amor!\n\n3. Por el Consolador\nque enviaste, oh Señor, ¡a ti loor!\nÉl en tu Iglesia está, tu gracia y paz le da,\nde ti la llena ya. ¡Gloria al Dios de amor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/008.1%20-%20Padre%2C%20%C2%A1gran%20Dios%20de%20amor%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/8.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/8.mp4"},{"id":"hyc_revision_revisado_009","bookId":"hyc_revision","number":"8.2","title":"Padre, gran Dios de amor (alternativa)","type":"Revisado","topic":"Sin clasificar","lyric":"1. Padre, gran Dios de amor que reveló el Señor, ¡a ti loor!\ndel seno paternal, el puro manantial, fluye vida eternal. ¡A ti loor!\n\n2. Por nuestro Redentor,\nel Hijo de tu amor, ¡a ti loor!\nSu vida entregó, su sangre nos lavó\ny el cielo nos abrió. ¡A ti loor!\n\n3. Por el Consolador\nque enviaste, oh Señor, ¡a ti loor!\nÉl en tu Iglesia está, tu gracia y paz le da,\nde ti la llena ya. ¡A ti loor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/008.2%20-%20Padre%2C%20gran%20Dios%20de%20amor%20%28alternativa%29.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/8%20Alternat.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/8%20Alternat.mp4"},{"id":"hyc_revision_revisado_010","bookId":"hyc_revision","number":"9","title":"¡Abba Padre! te adoramos","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Abba, Padre!\nte adoramos en el nombre de Jesús.\nDios y Padre te llamamos, hechos hijos de la luz;\nsalvos ya, del juicio libres, de la muerte sin temor por el cruento sacrificio del divino Salvador.\n\n2. Descarriados anduvimos y alejados del hogar;\nmas tu voz de amor oímos, pues quisístenos llamar.\nPor Jesús nos perdonaste y nos acercaste a ti,\nnos besaste y nos sentaste a gozar tu amor aquí.\n\n3. Por tu mano revestidos del ropaje de salud,\ny en tu casa recogidos por tu gran solicitud,\npor tu Espíritu gozamos de poder y de adopción\ny, del cielo ciudadanos, anhelamos tu mansión.\n\n4. ¡Abba, Padre! Te alabamos, muy alegres de saber\nque en tu Hijo amado estamos y así has dado a conocer\na tus ángeles en gloria tu poder, ciencia y amor;\n¡oh, qué excelsa tu victoria! Te adoramos con fervor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/009%20-%20%C2%A1Abba%20Padre%21%20te%20adoramos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/9.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/9.mp4"},{"id":"hyc_revision_revisado_011","bookId":"hyc_revision","number":"10","title":"Cantarte, Dios de amor","type":"Revisado","topic":"Sin clasificar","lyric":"1. Cantarte, Dios de amor, de luz, verdad y gloria, gozarnos siempre en ti, y honrarte con fervor;\ncelebrar de Jesús la suprema victoria, de la fe es la porción lograda por tu amor.\n\n2. Tu gracia, eterno Dios, y tu poder fecundo\nnos desplegaste aquí en tu Hijo el Salvador;\nel claror de tu faz brilla en lóbrego mundo,\ninunda nuestro ser de vida y gran fulgor.\n\n3. Tus hijos somos ya; tu nombre amado, ¡oh Padre!,\ninfunde dulce paz, total seguridad.\nDe tu Espíritu el don nos enseña y nos abre\ncamino a tu favor y acceso a tu verdad.\n\n4. El triunfo de Jesús, su muerte y su vida\nnos hizo merecer, ¡oh Dios!, tu gran favor.\nTodo viene de ti en tal obra bendita,\ny para honrarte a ti nos apartó tu amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/010%20-%20Cantarte%2C%20Dios%20de%20amor.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/10.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/10.mp4"},{"id":"hyc_revision_revisado_012","bookId":"hyc_revision","number":"11","title":"Loor te rendimos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Loor te rendimos, ¡gran Dios de bondad!, pues tú nos has dado la felicidad;\nen Cristo elegidos, aceptos en él, oh Padre, perfectos, nos ves tú en él.\n\n2. Limpiados, salvados, redimidos ya,\ntus hijos podemos llamarte: ¡Abba!\nGozamos en Cristo tu gracia y favor,\ntu nombre glorioso y tu grande amor.\n\n3. En él nos has dado tu luz, tu verdad;\nes nuestra justicia, paz y santidad.\nTus hijos, ¡oh Padre!, te rinden loor\npor Cristo Jesús, ¡nombre de suave olor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/011%20-%20Loor%20te%20rendimos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/11.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/11.mp4"},{"id":"hyc_revision_revisado_013","bookId":"hyc_revision","number":"12","title":"¡Oh divino favor!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Oh, divino favor!, de Dios el amor triunfante nos reveló Jesús con gracia abundante;\nsu mano nos libró del mundo pecador, a Dios nos consagró un pueblo adorador, un pueblo adorador.\n\n2. Desde la eternidad, ¡misterio jamás sondeado!,\nnos escogiste ¡oh Dios!, en Cristo, tu Hijo amado;\ntu Espíritu da luz, nos llena de fervor,\nmostrando por Jesús tu corazón de amor (bis).\n\n3. Has hallado, oh gran Dios!, cumplida total justicia\nen el postrer Adán, quien solo es tu delicia;\ntu Muy Amado es él, por siempre te exaltó,\ny en tu ley real su gozo siempre halló (bis).\n\n4. Tú has dado a Jesús, cual don de tu amor inmenso,\nobró eternal salud por su dolor intenso;\nnuestra justicia es él, y paz y santidad,\nsu vida es nuestra ya y por la eternidad (bis).","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/012%20-%20%C2%A1Oh%20divino%20favor%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/12.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/12.mp4"},{"id":"hyc_revision_revisado_014","bookId":"hyc_revision","number":"13","title":"Gloriosa herencia, ¡oh Padre!","type":"Revisado","topic":"Sin clasificar","lyric":"1. Gloriosa herencia, ¡oh Padre, has de gozar, la que en tus santos pronto has de heredar;\npara alabanzas de tu gloria son, tu redimida, santa posesión.\n\n2. En servidumbre y lejos de tu luz\nhalláronse tus hijos, mas Jesús\nmuerte sufrió, por nos resucitó\ny en uno a todos por su cruz juntó.\n\n3. Con gran potencia en Cristo obraste tú;\ny a la Iglesia, que es su plenitud,\nlo diste por Cabeza, y su poder\nsojuzga todo para tu placer.\n\n4. Por él tu santa voluntad será\nbien prosperada; a ti todo traerá\nen sumisión, en paz y santidad:\nDios todo en todos, por la eternidad.\n\n5. Gloria suprema, eterna bendición\nes la esperanza de tu vocación;\n¡Oh, Dios de gloria, excelso en loor!,\ndescansarás en tu divino amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/013%20-%20Gloriosa%20herencia%2C%20%C2%A1oh%20Padre%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/13.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/13.mp4"},{"id":"hyc_revision_revisado_015","bookId":"hyc_revision","number":"14","title":"¡Cuán grande es nuestro Dios","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Cuán grande es nuestro Dios, que al Hijo de su amor nos entregó!\n¡Qué don que llena alma y corazón!\n¡Cuán grande es nuestro Dios!\n\n2. ¡Ni al Hijo escatimó!\nSu muerte libra al alma del temor,\ny rebelión nos cambia por amor.\n¡Ni al Hijo escatimó!\n\n3. ¿Quién nos condenará?\nJesús murió, resucitó y subió;\nfiel intercede por nos ante Dios.\n¿Quién nos condenará?\n\n4. ¡Nos justifica Dios!\nTal gracia, ¡quién la puede revocar?\n¿O quién nos volverá a encadenar?\n¡Nos justifica Dios!\n\n5. ¡Nuestro es el triunfo ya,\npues Jesucristo a Satanás venció\ny, victorioso, el cielo nos abrió!\n¡Nuestro es el triunfo ya!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/014%20-%20%C2%A1Cu%C3%A1n%20grande%20es%20nuestro%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/14.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/14.mp4"},{"id":"hyc_revision_revisado_016","bookId":"hyc_revision","number":"15","title":"Jesús murió; su sangre abrió entrada","type":"Revisado","topic":"Sin clasificar","lyric":"1. Jesús murió;\nsu sangre abrió entrada dentro del velo, al celestial lugar, en donde el alma, ya purificada, cerca de ti, ¡oh Dios!, puede adorar.\nPor Cristo entrando, nada allí tememos;\ntu gloria no nos puede amedrentar.\nEn luz estamos, plena paz tenemos, la que en justicia él nos pudo dar.\n\n2.Contigo ahí, Señor, nos encontramos;\ntú nos presentas a tu Padre Dios,\nen cuya gracia paternal estamos,\ngozosos de elevarle nuestra voz.\nPor ti, Jesús, el Hijo muy amado,\ntenemos vida, luz y comunión;\nasí llegamos como tus hermanos,\ncon voz de canto y de adoración.\n\n3.Te alabamos porque te dignaste,\n¡oh Dios!, a nuestro lado aproximar,\ny que por Cristo cerca nos llevaste\ncomo hijos muy amados en tu hogar.\nCual sacerdotes a ti consagrados,\n¡oh Padre!, para darte adoración:\nofrenda espiritual de rescatados,\nde grato olor para tu corazón.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/015%20-%20Jes%C3%BAs%20muri%C3%B3%3B%20su%20sangre%20abri%C3%B3%20entrada.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/15.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/15.mp4"},{"id":"hyc_revision_revisado_017","bookId":"hyc_revision","number":"16","title":"En Cristo nos has dado Pontífice real","type":"Revisado","topic":"Sin clasificar","lyric":"1. En Cristo nos has dado Pontífice real;\n¡oh Dios!, por él llegamos con libertad filial a tu santuario mismo, el único lugar, en donde, como Padre, podémoste alabar.\n\n2. Con júbilo llegamos, con himnos de amor,\ntrayendo la belleza y las glorias del Señor.\nPerfumes difundiendo de grata oblación,\na ti, por siempre, digno de toda adoración.\n\n3. Pontífice divino, supremo, es tu Jesús,\ny por él nos hallamos en tu celeste luz.\nPerfecto y sublimado, él mismo se ofreció;\ncon propia sangre obtuvo eterna redención.\n\n4. ¡Loor, suprema gloria te damos nuestro Dios!\nde gratos corazones es eco nuestra voz;\nen tu santuario, oh Padre, a ti podemos ver;\ny, en Cristo revelados, tu gracia y tu poder.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/016%20-%20En%20Cristo%20nos%20has%20dado%20Pont%C3%ADfice%20real.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/16.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/16.mp4"},{"id":"hyc_revision_revisado_018","bookId":"hyc_revision","number":"17","title":"En Cristo bendecidos","type":"Revisado","topic":"Sin clasificar","lyric":"1. En Cristo bendecidos, loámoste, ¡oh Dios!;\ncon júbilo elevamos, fervientes, nuestra voz.\nEn su obra consumada podemos descansar, y hallamos dulce agrado en su loor cantar.\n\n2. ¡Oh Padre, qué belleza en tu Hijo se ve!\nbelleza discernida ahora por la fe,\nbelleza que delante de ti por siempre está,\nbelleza que incesante placer a ti te da.\n\n3. En él también contemplas a aquél que vino aquí,\ny por su amarga muerte honró tu trono allí;\ny con su propia sangre cumplió la expiación,\nque acrecentó tu gloria con nuestra salvación.\n\n4. ¡Loor a tu grandeza, y gloria por tu amor!\n–Amor tan admirable de nuestro Redentor–.\nLos siglos infinitos por siempre contarán\nla historia de tu gracia, y honores te darán.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/017%20-%20En%20Cristo%20bendecidos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/17.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/17.mp4"},{"id":"hyc_revision_revisado_019","bookId":"hyc_revision","number":"18","title":"Canciones nuevas","type":"Revisado","topic":"Sin clasificar","lyric":"1. Canciones nuevas, alegremente, cantemos todos a nuestro Dios;\npor él tenemos a Jesucristo, al mundo dado por bendición.\n\nCoro:\nElevemos sin cesar dulces himnos de loor a ti, nuestro Padre, por Cristo el Señor.\n¡Santos, cantemos con alegría himnos de gloria a nuestro Dios!\n\n2. Paz y justicia al fin se besaron,\ny la verdad abrazó al amor.\n¡Glorioso encuentro allá en el Calvario!\nDios ha mostrado su corazón.\n\n3. La Peña heriste, bebió el sediento;\nde su hendidura brotó salud.\nEn ella, firmes, tú nos mostraste,\n¡oh Dios!, tu gracia y tu plenitud.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/018%20-%20Canciones%20nuevas.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/18.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/18.mp4"},{"id":"hyc_revision_revisado_020","bookId":"hyc_revision","number":"19","title":"Junto a Dios, en gloria y en exaltación","type":"Revisado","topic":"Sin clasificar","lyric":"1. Junto a Dios, en gloria y en exaltación, ved entronizado al real Varón, Cristo, Rey de gloria, quien al mal venció.\nPor su gran victoria Dios lo enalteció.\n\nCoro:\nPor su obra hecha con fidelidad ya fue vindicada, Dios, tu santidad.\n\n2. Vino a rescatarnos por su amarga cruz,\nquiso presentarnos en celeste luz;\nlas obras del diablo vino a deshacer,\npues venció al «fuerte» y a su gran poder.\n\n3. El Resucitado sirve hoy allí\ny paciente espera su regreso aquí;\nreinará glorioso con justicia y paz\nsobre cielo y tierra con vara eficaz.\nMientras esperamos al gran Salvador,\ngloria, ¡oh Dios!, te damos y adoración.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/019%20-%20Junto%20a%20Dios%2C%20en%20gloria%20y%20en%20exaltaci%C3%B3n.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/19.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/19.mp4"},{"id":"hyc_revision_revisado_021","bookId":"hyc_revision","number":"20","title":"Dios y Padre, te alabamos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Dios y Padre, te alabamos por tu celestial favor;\nhechos hijos, en salzamos tu poder y grande amor.\nTal amor eterno, inmenso, nos mostraste por Jesús, cuando con dolor intenso dio su vida en una cruz.\n\n2. Libertados por su muerte, proseguimos al hogar;\nen tu luz podemos verte y alabanzas a ti dar;\nel Consolador, guiando, nos conduce, ¡oh Padre!, a ti\ngozo siempre al alma dando cual maná secreto aquí.\n\n3. Bendecidos por tu gracia y llamados a tu luz,\nen lugares celestiales nos sentaste en Jesús.\nYa tus glorias contemplamos en su rostro, ¡oh Padre Dios!,\ny gozosos te alabamos, entonando tu loor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/020%20-%20Dios%20y%20Padre%2C%20te%20alabamos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/20.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/20.mp4"},{"id":"hyc_revision_revisado_022","bookId":"hyc_revision","number":"21","title":"Nuestro Dios, el poder infinito","type":"Revisado","topic":"Sin clasificar","lyric":"1. Nuestro Dios, el poder infinito siempre dura, constante en tu ser, mientras ves a millares los siglos su carrera sin fin recorrer.\nEs verdad que es estrecho el camino, y muy débil y flaco el mortal;\npero, ¡oh Dios poderoso!, lo alientas, dando al santo vigor perennal.\n\n2. En tu fuente, que nunca se agota, nuestras almas, por fe, beberán;\ntu amor poderoso las guía, y por sendas de gozo andarán.\nComo el ave veloz subiremos, y en el trono te habremos de ver;\ncon las alas muy leves, gozosos, la carrera podremos correr.\n\n3. Prosigamos la senda celeste, y vistamos las armas de luz;\nvenceremos del mundo las huestes, revestidos de Cristo Jesús.\nNuestro Dios, magnifica tu gracia, y nos llene tu divino amor;\nque tu Espíritu, con su potencia, obre en nos por el gran vencedor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/021%20-%20Nuestro%20Dios%2C%20el%20poder%20infinito.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/21.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/21.mp4"},{"id":"hyc_revision_revisado_023","bookId":"hyc_revision","number":"22","title":"Padre, tu soberano amor","type":"Revisado","topic":"Sin clasificar","lyric":"1. Padre, tu soberano amor en cautiverio nos buscó; tu Hijo amado paz obró;\nlibres, por fin, a ti nos llevó.\n\n2. ¡Eterno amor, que a tu Hijo dio\npara acercarnos a ti, oh Dios!\nhechos, según tu corazón,\nhijos por él, quien te complació.\n\n3. Hoy, como hijos, ante ti,\ngozo nos da al atravesar\nla senda que conduce allí,\ndonde él nos preparó lugar.\n\n4. Tu casa regia brilla allá,\ncon gloria y paz en plenitud;\ntu mismo amor, que todo da,\nnos hizo tuyos por Jesús.\n\n5. ¡Oh, gracia suma!, lo que allí\nde gozo llena todo ser;\nlo que Dios es —perfecto amor—\nhoy nos es dado a conocer.\n\n6. De aquella esfera el resplandor,\nluz, verdad y poder de Dios\nes Cristo, ¡oh Padre!, y su amor\nsolo gozamos de él en pos.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/022%20-%20Padre%2C%20tu%20soberano%20amor.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/22.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/22.mp4"},{"id":"hyc_revision_revisado_024","bookId":"hyc_revision","number":"23","title":"Tenemos entrada a tu gracia por fe","type":"Revisado","topic":"Sin clasificar","lyric":"1. Tenemos entrada a tu gracia por fe;\nen Cristo segura nuestra alma se ve.\nYa justifica dos, contigo en paz estamos, ¡oh Dios!, por su sangre eficaz.\n\n2. En tu Hijo has mostrado por el pecador\nla prueba perfecta de tu inmenso amor;\npues, siendo enemigos ¡oh, qué condición!,\nsu muerte nos trajo reconciliación.\n\n3. Por él ya gozamos total salvación;\nsu cruz puede dar plena liberación,\npues Cristo al pecado murió una vez,\nmas resucitados con él tú nos ves.\n\n4. Por ti alentados en gracia al andar,\nla fe y la esperanza nos has de aumentar.\nDel yermo la prueba, dolor y aflicción,\ntú, todo lo cambias en gran bendición.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/023%20-%20Tenemos%20entrada%20a%20tu%20gracia%20por%20fe.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/23.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/23.mp4"},{"id":"hyc_revision_revisado_025","bookId":"hyc_revision","number":"24","title":"¡Load al gran Rey!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Load al gran Rey!\n¡Su gloria anunciad, su amor por su grey con gracia cantad!\nEs nuestro escudo, baluarte y sostén, el Omnipotente por siglos. ¡Amén!\n\n2. Tu inmensa bondad ¡¿qué lengua dirá?!\n¿o quién tu verdad jamás sondeará?\nRiquezas de gracia tus manos proveen,\ny es fiel tu palabra a los que en ti creen.\n\n3. ¡Sublime poder! ¡Eterno amor!\n¡Soberano Dios, te damos loor!\n¡Cuán maravillosa tu gran creación!;\nmas, ¡oh, qué asombrosa es tu redención!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/024%20-%20%C2%A1Load%20al%20gran%20Rey%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/24.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/24.mp4"},{"id":"hyc_revision_revisado_026","bookId":"hyc_revision","number":"25","title":"Nuestro Dios, con gozo santo","type":"Revisado","topic":"Sin clasificar","lyric":"1. Nuestro Dios, con gozo santo hoy cantamos de tu amor, y el triunfo de tu gracia celebramos con fervor.\nNos tomaste sobre alas fuertes de águilas, a ti;\na la luz de tus alturas, libres y en tu paz al fin.\n\n2. Todos nuestros enemigos tú venciste con poder;\nnos libraste de la muerte, pues quisístenos tener\ncual tesoro muy preciado, sacerdotes por Jesús,\npueblo santo, rescatado por la sangre de su cruz.\n\n3. Este pueblo fue adquirido, siendo Cristo el mediador,\nel varón de tu deleite, el glorioso Redentor,\npor tu gracia respondemos a tu corazón, oh Dios;\ny por Cristo ya vivimos en tu esplendente luz.\n\n4. Tu Espíritu nos guía, de la vida es el poder,\ny de Cristo nos enseña, dándonos a conocer\nlas bellezas de esa vida que te agrada a ti, oh Dios,\ny tu pueblo unido canta tu loor en alta voz.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/025%20-%20Nuestro%20Dios%2C%20con%20gozo%20santo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/25.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/25.mp4"},{"id":"hyc_revision_revisado_027","bookId":"hyc_revision","number":"26","title":"¡Gloria a Dios!, porque su gracia","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Gloria a Dios!, porque su gracia en nosotros abundó, y su fiel misericordia en nosotros se mostró.\n¡Gloria a Dios!, porque nos mira en su amor y gran bondad, y, con su poder, nos viste de justicia y santidad.\n\n2. ¡Gloria a Dios, que nos ha dado a Jesús el Salvador!;\n¡Don precioso de su gracia es el Hijo de su amor!\n¡Gloria a Dios, que aquí nos une en perfecta y dulce paz,\nprotegidos por su diestra, alumbrados por su faz!\n\n3. ¡Gloria a Dios!, a quien complace recibir nuestra oración,\nnuestros cantos de alabanza, por Jesús la adoración.\n¡Gloria a Dios!, que en abundancia toda bendición nos da;\ny, si él obra así en su gracia, ¡en la gloria, qué será!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/026%20-%20%C2%A1Gloria%20a%20Dios%21%2C%20porque%20su%20gracia.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/26.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/26.mp4"},{"id":"hyc_revision_revisado_028","bookId":"hyc_revision","number":"27","title":"Padre de amor, gran Dios","type":"Revisado","topic":"Sin clasificar","lyric":"1. Padre de amor, gran Dios, alzamos a ti nuestras manos y el corazón;\nnuestra oración a ti elevamos, y, por Jesús, el Nombre que amamos, sube fragante la adoración.\n\n2. Dados por ti a tu Hijo amado,\n\n3. Por tal amor, nuestra flaqueza,\nque al alma hace siempre aquí suspirar,\napela a tu dulce terneza;\ny el Santo Espíritu de la promesa\nnos hace, oh Dios, bendecirte a ti.\n\n4. En este erial que recorremos,\nJesús, acudimos por todo a ti.\nTan solo en ti fuerza tenemos;\ntú eres el raudal donde bebemos\ny el vivo pan de tu pueblo aquí.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/027%20-%20Padre%20de%20amor%2C%20gran%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/27.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/27.mp4"},{"id":"hyc_revision_revisado_029","bookId":"hyc_revision","number":"28","title":"De Dios hijos muy amados","type":"Revisado","topic":"Sin clasificar","lyric":"1. De Dios hijos muy amados, en Jesús sublime don, en el Hijo nos ve el Padre, en su santa perfección.\n\nCoro:\nMirad cuán grande amor el Padre nos ha otorgado, que hijos de Dios seamos por siempre llamados.\n\n2. De Jesús llevar la imagen, por su gracia y su poder;\ndarnos de su gloria parte, él dignóse prometer.\n\n3. Adoptados por su gracia, hechos hijos por amor,\nsu herencia incorruptible ya es nuestra posesión.\n\n4. ¡Qué gloriosa esperanza: contemplar al Salvador!\nPronto en gloria, transformados, reflejando su fulgor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/028%20-%20De%20Dios%20hijos%20muy%20amados.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/28.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/28.mp4"},{"id":"hyc_revision_revisado_030","bookId":"hyc_revision","number":"29","title":"Al Padre Omnipotente","type":"Revisado","topic":"Sin clasificar","lyric":"1. Al Padre Omnipotente, al Hijo de su amor, por el Santo Espíritu, ¡dad gloria y honor!\nY de su amor la inmensidad humildes ensalzad;\npor siglos de siglos, con himnos de triunfo su gloria publicad;\ncon cánticos de triunfo su gloria publicad, su excelsa majestad y su eterna bondad: ¡su gloria, su gloria publicad!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/029%20-%20Al%20Padre%20Omnipotente.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/29.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/29.mp4"},{"id":"hyc_revision_revisado_031","bookId":"hyc_revision","number":"30.1","title":"Verbo divino","type":"Revisado","topic":"Sin clasificar","lyric":"1. Verbo divino, con Dios tú has estado eternamente, en luz sin igual;\nantes del tiempo, Dios siempre has sido, entronizado en gloria eternal.\n\n2. Omnipotente, por ti fueron hechas\ntodas las cosas, ¡oh Dios creador!\nGrande Señor, Dios glorioso en tu esencia,\nluz siempre has sido y siempre amor.\n\n3. Tú, el Hijo eterno, el Verbo encarnado,\npor ti vinieron la gracia y verdad;\ny entre nosotros tú has habitado,\nmanifestando la santa Deidad.\n\n4. Cuerpo tomaste, por Dios preparado,\ny voluntario subiste al altar.\n¡Qué sacrificio, que a Dios ha agradado,\ny que a sus hijos logró rescatar!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/030.1%20-%20Verbo%20divino.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/30.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/30.mp4"},{"id":"hyc_revision_revisado_032","bookId":"hyc_revision","number":"30.2","title":"Verbo divino (alternativa)","type":"Revisado","topic":"Sin clasificar","lyric":"1. Verbo divino, con Dios tú has estado eternamente, en luz sin igual;\nantes del tiempo, Dios siempre has sido, entronizado en gloria eternal.\n\n2. Omnipotente, por ti fueron hechas\ntodas las cosas, ¡oh Dios creador!\nGrande Señor, Dios glorioso en tu esencia,\nluz siempre has sido y siempre amor.\n\n3. Tú, el Hijo eterno, el Verbo encarnado,\npor ti vinieron la gracia y verdad;\ny entre nosotros tú has habitado,\nmanifestando la santa Deidad.\n\n4. Cuerpo tomaste, por Dios preparado,\ny voluntario subiste al altar.\n¡Qué sacrificio, que a Dios ha agradado,\ny que a sus hijos logró rescatar!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/030.2%20-%20Verbo%20divino%20%28alternativa%29.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/30%20Alternat.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/30%20Alternat.mp4"},{"id":"hyc_revision_revisado_033","bookId":"hyc_revision","number":"31","title":"Oid un son en alta esfera","type":"Revisado","topic":"Sin clasificar","lyric":"1. Oíd un son en alta esfera: «En los cielos gloria a Dios, y al mortal paz en la tierra», dice la celeste voz. Con los cielos alabemos;\nal eterno Rey cantemos, a Jesús el Dios de amor, el «Ungido del Señor»\n\nCoro:\nJunto a la celeste voz, ¡demos gloria a nuestro Dios!\n\n2. El Señor de los señores, de Dios Hijo eternal,\npor salvar a pecadores bajó al vientre virginal.\n¡Gloria al Verbo encarnado, en humanidad velado!\n¡Gloria a nuestro Redentor, Emmanuel, siervo y Señor!\n\n3. Príncipe de paz eterna, ¡gloria a ti, Señor Jesús!\ndesde el seno de tu Padre nos trajiste vida y luz.\nHas tu majestad dejado y buscarnos te has dignado;\npara darnos el vivir en la cruz fuiste a morir.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/031%20-%20Oid%20un%20son%20en%20alta%20esfera.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/31.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/31.mp4"},{"id":"hyc_revision_revisado_034","bookId":"hyc_revision","number":"32","title":"Hasta la tierra bajó el cielo","type":"Revisado","topic":"Sin clasificar","lyric":"1. Hasta la tierra bajó el cielo: vino a nosotros Emmanuel.\nDios se hizo hombre, ¡qué misterio!\n¡Adorémosle siempre a él.\n\n2. ¿Quién este amor sondear pudiera?\nDe Dios el Hijo, el Creador,\npor los perdidos, a esta tierra\nvino, humilde, cual servidor.\n\n3. Este amor, que así se humilla,\naún más abajo descendió:\nHijo del hombre que su vida\npor un mundo perdido dio.\n\n4. ¿Qué incienso puro, en su fragancia,\nte ofreceríamos, Señor?\n¡El nardo de nuestra alabanza,\noh Jesús, es tu mismo amor!\n\n5. Ya recibido allá en el cielo,\nhabiendo hecho la expiación,\nvemos tu rostro ya sin velo:\n¡eres digno de adoración!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/032%20-%20Hasta%20la%20tierra%20baj%C3%B3%20el%20cielo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/32.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/32.mp4"},{"id":"hyc_revision_revisado_035","bookId":"hyc_revision","number":"33","title":"Hijo eternal, de Dios perfecta imagen","type":"Revisado","topic":"Sin clasificar","lyric":"1. Hijo eternal, de Dios perfecta imagen, adoración los ángeles te dan.\n¡A ti loor!, tu nombre exaltamos, centro de la gloria por la eternidad.\n\n2.Viniste aquí a darte en sacrificio,\ny solo así a Dios glorificar;\nsu santidad, su amor y su justicia\ntu cruz, ¡oh Jesús!, logró magnificar.\n\n3.Venciste tú, por Dios mismo exaltado;\nte vemos ya junto a la Majestad;\nCristo de Dios, de gloria coronado:\ntú, Hijo del hombre, Hombre celestial.\n\n4.¡Gloria y honor a ti, cuya corona\nal corazón recuerda tu dolor!\n¡Señor Jesús, contigo pronto en gloria\nte adoraremos con eterno amor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/033%20-%20Hijo%20eternal%2C%20de%20Dios%20perfecta%20imagen.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/33.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/33.mp4"},{"id":"hyc_revision_revisado_036","bookId":"hyc_revision","number":"34","title":"¡Oh! quién jamás pudo expresar, Señor","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Oh!, ¿quién jamás pudo expresar, Señor, o sondear la hondura de tu amor;\nmedir la fuente misma de tu ser, o la extensión y grande altura ver de tal amor?\n\n2. ¿Quién pudo amor tan grande conocer?\nel cielo no lo pudo contener;\nmas hasta nuestro mundo rebosó,\npues, al morir en cruz, Jesús mostró el amor de Dios.\n\n3. ¿Quién pudo dar perfecta adoración\nque fuese digna de tan grande amor?\nHoy canta nuestro débil corazón\na ti, Señor Jesús, ¡oh, admirable Salvador!\n\n4. Tu Iglesia pronto en gloria ya estará;\nSeñor Jesús, tu rostro allí verá.\nEntonces, en sus himnos de loor,\nel culto digno de tan grande amor te rendirá.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/034%20-%20%C2%A1Oh%21%20qui%C3%A9n%20jam%C3%A1s%20pudo%20expresar%2C%20Se%C3%B1or.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/34.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/34.mp4"},{"id":"hyc_revision_revisado_037","bookId":"hyc_revision","number":"35","title":"Hijo eterno de Dios","type":"Revisado","topic":"Sin clasificar","lyric":"1. Hijo eterno de Dios, del Padre el muy ama

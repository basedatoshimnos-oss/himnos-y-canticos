let fav=new Set(storeJson('hyc_fav',[])),saved=new Set(storeJson('hyc_saved',[])),recent=storeJson('hyc_recent',[]);
let listenQuery='',listenCurrent=null,listenShuffle=false,listenStarted=false,listenRepeat='all',listenError='';
let listenPlaylists=(()=>{let v=storeJson('hyc_playlists_v1',[]);return Array.isArray(v)?v.filter(p=>p&&p.id&&p.name&&Array.isArray(p.hymnIds)):[]})();
let savedPlaylistId=storeGet('hyc_playlist_selected');
let listenSelected=listenPlaylists.some(p=>p.id===savedPlaylistId)?savedPlaylistId:null;
const listenAudio=new Audio();
listenAudio.onended=()=>{if(listenRepeat==='one'&&listenCurrent){listenAudio.currentTime=0;listenAudio.play().catch(()=>{})}else listenNext(true)};
listenAudio.onplay=()=>{if(page==='listen')renderListen()};listenAudio.onpause=()=>{if(page==='listen')renderListen()};listenAudio.ontimeupdate=()=>{let s=$('#listenProgress'),a=$('#listenPosition');if(s){s.max=Math.max(1,listenAudio.duration||1);s.value=listenAudio.currentTime||0}if(a)a.textContent=durationText(listenAudio.currentTime)};
const $=s=>document.querySelector(s),app=$('#app');
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){storeSet('hyc_fav',JSON.stringify([...fav]));storeSet('hyc_recent',JSON.stringify(recent));storeSet('hyc_saved',JSON.stringify([...saved]));storeSet('hyc_reader',reader);storeSet('hyc_book',book);storeSet('hyc_corario',corarioUnlocked?'1':'0');storeSet('hyc_theme',themeId);}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9.\s]/g,' ').replace(/\s+/g,' ').trim()}
function compact(s){return norm(s).replace(/^nuevo\s+/,'n').replace(/\s+/g,'').replace('n.','n')}
function bookAllowed(id){return id==='hyc_revision'||(id==='corario_ninos'&&corarioUnlocked)}
function activeHymns(){if(!bookAllowed(book))book='hyc_revision';return HYMNS.filter(h=>h.bookId===book&&bookAllowed(h.bookId))}
function bookSwitch(){let entries=Object.entries(BOOKS).filter(([id])=>bookAllowed(id));if(entries.length<2)return '';return `<div class="card"><b>Cambiar libro</b><div class="chips" style="padding-top:10px">${entries.map(([id,b])=>`<button class="chip ${book===id?'active':''}" onclick="book='${id}';filter='todos';save();render()">${b.name}</button>`).join('')}</div></div>`}
function score(h,q){let qc=compact(q), n=compact(h.number), nn=h.type==='Nuevo'?'n'+n:n, t=norm(h.title), l=norm(h.lyric); if(qc===n||qc===nn)return 999; if(t===q)return 900; if(t.startsWith(q))return 800; if(t.includes(q))return 650; if(l.includes(q))return 300; return 100}
function filtered(){let q=norm(query);let arr=activeHymns().filter(h=>filter==='todos'||(filter==='nuevo'&&h.type==='Nuevo')||(filter==='revisado'&&h.type==='Revisado')||(filter==='favoritos'&&fav.has(h.id))||(filter==='guardados'&&saved.has(h.id))); if(q) arr=arr.filter(h=>norm(h.number+' '+h.title+' '+h.type+' '+h.topic+' '+h.lyric).includes(q)||compact(h.number)===compact(q)||(h.type==='Nuevo'&&('n'+compact(h.number))===compact(q))).sort((a,b)=>score(b,q)-score(a,q)); return arr}
function nav(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function chips(current){let main=book==='hyc_revision';const names=main?{todos:'Todos',nuevo:'Nuevos',revisado:'Revisados'}:{todos:'Todos'};return Object.keys(names).map(f=>`<button class="chip ${current===f?'active':''}" onclick="filter='${f}';renderList()">${names[f]}</button>`).join('')}
function hymnCard(h){return `<div class="card hymn fade" onclick="openHymn('${h.id}')"><div class="num">${h.number}</div><div class="spacer"><div class="title">${esc(h.title)}</div><div class="meta">${h.type} · ${esc(h.topic||'Adoración')} · ${h.audio?'🎧 ':''}${h.pdf?'📄 ':''}${h.video?'▶':''}${h.lyric&&!h.audio&&!h.pdf&&!h.video?'Letra':''}</div></div>${h.audio?`<button class="chip" title="Añadir a playlist" onclick="event.stopPropagation();playlistAdd('${h.id}')">＋♫</button>`:''}<button class="chip" onclick="event.stopPropagation();toggleFav('${h.id}')">${fav.has(h.id)?'★':'☆'}</button></div>`}
function renderHome(){let b=BOOKS[book];app.innerHTML=`<section class="card hero fade"><p class="gold"><b>Catálogo de cantos</b></p><h1>${b.name}</h1><p class="muted" style="margin-top:8px;font-weight:700">“Cantaré con el espíritu, pero cantaré también con el entendimiento.”<br>1 Corintios 14:15</p><button class="btn" style="width:100%;margin-top:16px" onclick="nav('list')">Buscar himno</button></section>`}
function renderList(){let arr=filtered();app.innerHTML=`${bookSwitch()}<h2>${BOOKS[book].name}</h2><p class="muted">${arr.length} disponibles</p><input class="search" placeholder="Buscar número, título o frase" value="${esc(query)}" oninput="query=this.value;renderList()"><div class="chips">${chips(filter)}</div><div>${arr.length?arr.map(hymnCard).join(''):'<div class="card empty">No hay resultados. Prueba otro número, título o frase.</div>'}</div>`}
function renderLibrary(){const list=ids=>ids.map(id=>HYMNS.find(h=>h.id===id&&h.bookId===book)).filter(Boolean);let groups=[['Favoritos',[...fav]],['Recientes',recent],['Guardados',[...saved]]];app.innerHTML=`${bookSwitch()}<h2>Biblioteca</h2><p class="muted">Tus cantos rápidos en este dispositivo.</p>`+groups.map(([name,ids])=>`<h3 class="section-title">${name} · ${list(ids).length}</h3>${list(ids).length?list(ids).slice(0,8).map(hymnCard).join(''):'<div class="card empty">Sin cantos todavía.</div>'}`).join('')}
function listenAll(){return HYMNS.filter(h=>h.bookId==='hyc_revision'&&h.audio)}
function selectedPlaylist(){return listenPlaylists.find(p=>p.id===listenSelected)||null}
function listenQueue(){let p=selectedPlaylist(),all=listenAll();if(!p)return all;let byId=new Map(all.map(h=>[h.id,h]));return p.hymnIds.map(id=>byId.get(id)).filter(Boolean)}
function savePlaylists(){storeSet('hyc_playlists_v1',JSON.stringify(listenPlaylists));storeSet('hyc_playlist_selected',listenSelected||'')}
function playlistSelect(id){listenSelected=id||null;savePlaylists();renderListen()}
function playlistCreate(firstId=''){let name=(prompt('Nombre de la nueva playlist:')||'').trim();if(!name)return;if(listenPlaylists.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('Ya existe una playlist con ese nombre.');let p={id:'playlist_'+Date.now(),name,hymnIds:firstId?[firstId]:[]};listenPlaylists.push(p);listenSelected=p.id;savePlaylists();page==='listen'?renderListen():render()}
function playlistRename(id){let p=listenPlaylists.find(x=>x.id===id);if(!p)return;let name=(prompt('Nuevo nombre:',p.name)||'').trim();if(!name||name===p.name)return;if(listenPlaylists.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return alert('Ya existe una playlist con ese nombre.');p.name=name;savePlaylists();renderListen()}
function playlistDelete(id){let p=listenPlaylists.find(x=>x.id===id);if(!p||!confirm(`¿Eliminar «${p.name}»? Los himnos originales no se eliminarán.`))return;listenPlaylists=listenPlaylists.filter(x=>x.id!==id);if(listenSelected===id)listenSelected=null;savePlaylists();renderListen()}
function playlistAdd(hymnId){if(!listenPlaylists.length)return playlistCreate(hymnId);let choices=listenPlaylists.map((p,i)=>`${i+1}. ${p.name}`).join('\n');let chosen=Number(prompt(`Añadir a una playlist:\n${choices}\n\nEscribe el número:`));let p=listenPlaylists[chosen-1];if(!p)return;if(p.hymnIds.includes(hymnId))return alert('Ese himno ya está en la playlist.');p.hymnIds.push(hymnId);savePlaylists();page==='listen'?renderListen():render()}
function playlistRemove(id){let p=selectedPlaylist();if(!p)return;p.hymnIds=p.hymnIds.filter(x=>x!==id);savePlaylists();renderListen()}
function playlistMove(index,offset){let p=selectedPlaylist();if(!p)return;let next=index+offset;if(next<0||next>=p.hymnIds.length)return;[p.hymnIds[index],p.hymnIds[next]]=[p.hymnIds[next],p.hymnIds[index]];savePlaylists();renderListen()}
function durationText(value){let seconds=Math.max(0,Math.floor(Number(value)||0));return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function listenSeek(value){listenAudio.currentTime=Number(value)||0}
function listenSelect(id){let h=HYMNS.find(x=>x.id===id&&x.audio);if(!h)return;document.querySelectorAll('audio').forEach(a=>a.pause());listenCurrent=h;listenStarted=true;listenError='';listenAudio.src=h.audio;if('mediaSession' in navigator&&'MediaMetadata' in window){navigator.mediaSession.metadata=new MediaMetadata({title:h.title,artist:`Himno ${h.number}`,album:'Himnos y Cánticos',artwork:[{src:new URL('./icons/icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]})}listenAudio.play().catch(()=>{listenError='No se pudo reproducir el audio. Revisa tu conexión e inténtalo otra vez.';renderListen()});listenQuery='';renderListen()}
function listenToggle(){let q=listenQueue();if(!listenCurrent){if(q.length)listenSelect(q[0].id);return}listenStarted=true;if(listenAudio.paused)listenAudio.play().catch(()=>{listenError='No se pudo reanudar el audio.';renderListen()});else listenAudio.pause();renderListen()}
function listenNext(auto=false){let q=listenQueue();if(!q.length)return;let i=listenCurrent?q.findIndex(h=>h.id===listenCurrent.id):-1;if(auto&&listenRepeat==='off'&&i===q.length-1)return;if(listenShuffle&&q.length>1&&i>=0){let n=i;while(n===i)n=Math.floor(Math.random()*q.length);i=n}else i=(i+1)%q.length;listenSelect(q[i].id)}
function listenPrevious(){if(listenAudio.currentTime>3){listenAudio.currentTime=0;return}let q=listenQueue();if(!q.length)return;let i=listenCurrent?q.findIndex(h=>h.id===listenCurrent.id):0;if(i<0)i=0;i=(i-1+q.length)%q.length;listenSelect(q[i].id)}
function cycleRepeat(){listenRepeat=listenRepeat==='off'?'all':listenRepeat==='all'?'one':'off';renderListen()}
function renderListen(){let q=listenQueue(),all=listenAll(),p=selectedPlaylist(),n=norm(listenQuery),results=n?all.filter(h=>norm(h.number+' '+h.title+' '+h.lyric).includes(n)).slice(0,8):[];let source=p?p.name:'Todos los himnos';let player=listenCurrent?`<section class="card player fade"><p class="gold"><b>REPRODUCIENDO DESDE ${esc(source.toUpperCase())}</b></p><div class="cover">♫</div><h2>${esc(listenCurrent.title)}</h2><p class="muted" style="margin-top:6px">${listenCurrent.number} · ${esc(listenCurrent.type)}</p>${listenError?`<p style="color:#ffb5b5;margin-top:12px">${esc(listenError)}</p>`:''}<input id="listenProgress" class="progress" type="range" min="0" max="${Math.max(1,listenAudio.duration||1)}" value="${listenAudio.currentTime||0}" onchange="listenSeek(this.value)"><div class="row"><small id="listenPosition">${durationText(listenAudio.currentTime)}</small><span class="spacer"></span><small>${durationText(listenAudio.duration)}</small></div><div class="transport"><button class="round" title="Aleatorio" onclick="listenShuffle=!listenShuffle;renderListen()" style="color:${listenShuffle?'var(--gold)':'var(--cream)'}">🔀</button><button class="round" title="Anterior" onclick="listenPrevious()">⏮</button><button class="round play" title="Reproducir o pausar" onclick="listenToggle()">${listenAudio.paused?'▶':'Ⅱ'}</button><button class="round" title="Siguiente" onclick="listenNext()">⏭</button><button class="round" title="Repetición" onclick="cycleRepeat()" style="color:${listenRepeat==='off'?'var(--cream)':'var(--gold)'}">${listenRepeat==='one'?'🔂':'🔁'}</button></div><div class="grid" style="margin-top:14px"><button class="res mini" onclick="openHymn('${listenCurrent.id}')">📖 Ver letra</button><button class="res mini" onclick="playlistAdd('${listenCurrent.id}')">＋ Añadir a playlist</button></div></section>`:`<section class="card player fade"><div class="cover">♫</div><h2>Elige qué quieres escuchar</h2><p class="muted" style="margin:8px 0 16px">${q.length} himnos disponibles en ${esc(source)}.</p><button class="btn" style="width:100%" onclick="listenToggle()">▶ Reproducir ${esc(source)}</button></section>`;let cards=`<div class="playlist-strip"><button class="playlist ${!p?'active':''}" onclick="playlistSelect('')"><span class="playlist-icon">♫</span><b>Todos los himnos</b><small class="muted" style="display:block;margin-top:5px">${all.length} himnos</small></button>${listenPlaylists.map(x=>`<button class="playlist ${listenSelected===x.id?'active':''}" onclick="playlistSelect('${x.id}')"><span class="playlist-icon">🎵</span><b>${esc(x.name)}</b><small class="muted" style="display:block;margin-top:5px">${x.hymnIds.length} himnos</small></button>`).join('')}</div>`;let editor=p?`<section class="card"><div class="row"><div class="spacer"><h3>${esc(p.name)}</h3><p class="muted">${q.length} himnos · orden editable</p></div><button class="chip" onclick="playlistRename('${p.id}')">Renombrar</button><button class="chip" onclick="playlistDelete('${p.id}')">Eliminar</button></div>${q.length?`<button class="btn" style="width:100%;margin:14px 0 8px" onclick="listenSelect('${q[0].id}')">▶ Reproducir playlist</button>${q.map((h,i)=>`<div class="queue-row"><div class="num">${h.number}</div><div class="spacer"><b>${esc(h.title)}</b></div><button class="chip" onclick="playlistMove(${i},-1)">↑</button><button class="chip" onclick="playlistMove(${i},1)">↓</button><button class="chip" onclick="playlistRemove('${h.id}')">×</button></div>`).join('')}`:'<div class="empty">Busca un himno y añádelo a esta playlist.</div>'}</section>`:'';let up=q.filter(h=>h.id!==listenCurrent?.id).slice(0,5).map(h=>`<div class="queue-row" onclick="listenSelect('${h.id}')"><div class="num">${h.number}</div><div class="spacer"><b>${esc(h.title)}</b></div><span>▶</span></div>`).join('');app.innerHTML=`<div class="row"><div class="spacer"><h2>Escucha</h2><p class="muted">Tu música, playlists y reproducción continua.</p></div><button class="btn secondary" onclick="playlistCreate()">＋ Playlist</button></div>${player}<input class="search" placeholder="Buscar para reproducir o añadir" value="${esc(listenQuery)}" oninput="listenQuery=this.value;renderListen()">${results.length?`<div class="card">${results.map(h=>`<div class="queue-row"><div class="num">${h.number}</div><div class="spacer"><b>${esc(h.title)}</b></div><button class="chip" onclick="playlistAdd('${h.id}')">＋</button><button class="chip" onclick="listenSelect('${h.id}')">▶</button></div>`).join('')}</div>`:''}<div class="row section-title"><div class="spacer"><h3>Tu música</h3><p class="muted">Elige la cola que quieres escuchar</p></div><button class="chip" onclick="playlistCreate()">Nueva</button></div>${cards}${editor}<section class="card"><h3>A continuación · ${esc(source)}</h3>${up||'<div class="empty">No hay himnos en esta cola.</div>'}</section>`}
function unlockBook(){let code=(document.getElementById('unlockCode')?.value||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(code==='valparaiso'){corarioUnlocked=true;book='corario_ninos';filter='todos';save();alert('Canticos Escuelita Bíblica desbloqueado.');renderMore()}else alert('Código no válido.')}
function renderMore(){let unlock=corarioUnlocked?'':`<div class="card"><h3>Código de contenido</h3><p class="muted">Uso interno para habilitar contenido adicional.</p><input id="unlockCode" class="search" placeholder="Ingresar código"><button class="btn" style="width:100%" onclick="unlockBook()">Activar contenido</button></div>`;app.innerHTML=`${bookSwitch()}<h2>Más</h2><div class="card"><h3>Tamaño de letra</h3><p class="muted">Actual: ${reader} px</p><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="reader=Math.max(16,reader-2);save();renderMore()">A-</button><button class="btn secondary" onclick="reader=Math.min(34,reader+2);save();renderMore()">A+</button></div></div><div class="card"><h3>Apariencia</h3><p class="muted">Paleta actual: ${PALETTES[themeId][0]}</p><div class="chips" style="padding-top:10px">${Object.entries(PALETTES).map(([id,p])=>`<button class="chip ${themeId===id?'active':''}" onclick="setTheme('${id}')">${p[0]}</button>`).join('')}</div></div><button class="res" style="width:100%" onclick="location.href='mailto:${EMAIL}?subject=Observación general — Himnos y Canticos&body=Versión web ${VERSION}%0A%0ADetalle:%0A'">Reportar observación<small>Enviar comentario por correo</small></button><div class="card"><h3>Privacidad</h3><p class="muted">Sin registro, sin publicidad y con preferencias guardadas localmente.</p></div><div class="card"><h3>Acerca de</h3><p class="muted">Himnos y Cánticos · Web ${VERSION} · ${EMAIL}</p></div>${unlock}`}
function render(){if(page==='list')renderList(); if(page==='listen')renderListen(); if(page==='library')renderLibrary(); if(page==='more')renderMore()}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);save();render()}
function toggleSaved(id){saved.has(id)?saved.delete(id):saved.add(id);save();openHymn(id)}
function formatLyric(text){return esc(text||'Letra no disponible.').replace(/^Coro:/gm,'<b class="gold">Coro:</b>')}
function openHymn(id){let h=HYMNS.find(x=>x.id===id);if(!h)return;recent=[id,...recent.filter(x=>x!==id)].slice(0,20);save();let m=$('#modal'),s=$('#sheet');let primary=`${h.pdf?`<button class="res" onclick="openPdf('${id}')">📄 Partitura</button>`:''}${h.video?`<button class="res" onclick="openVideo('${id}')">▶ Video</button>`:''}`;s.innerHTML=`<div class="row"><div class="num">${h.number}</div><div class="spacer"><h2>${esc(h.title)}</h2><p class="muted">${h.type}</p></div>${h.audio?`<button class="chip" title="Añadir a playlist" onclick="playlistAdd('${id}')">＋♫</button>`:''}<button class="chip" onclick="closeModal()">Cerrar</button></div>${h.audio?`<div class="card"><h3>Escuchar himno</h3><audio class="audio" controls src="${h.audio}" onplay="listenAudio.pause()"></audio></div>`:''}<div class="card"><div class="row"><h3 class="spacer">Letra</h3><button class="chip" onclick="reader=Math.max(16,reader-2);save();openHymn('${id}')">A-</button><button class="chip" onclick="reader=Math.min(34,reader+2);save();openHymn('${id}')">A+</button></div><div class="lyric" style="--reader:${reader}px">${formatLyric(h.lyric)}</div></div>${primary?`<div class="grid">${primary}</div>`:''}<details class="card"><summary><b>Más opciones</b></summary><div class="grid" style="margin-top:12px"><button class="res" onclick="toggleSaved('${id}')">${saved.has(id)?'✓ Guardado':'⬇ Guardar letra'}</button><button class="res" onclick="location.href='mailto:${EMAIL}?subject=Observación ${encodeURIComponent(h.number+' — '+h.title)}&body=Versión ${VERSION}%0A%0ADetalle:%0A'">✉ Informar error</button></div></details>`;m.classList.add('open')}
function openPdf(id){let h=HYMNS.find(x=>x.id===id);if(!h||!h.pdf)return;let mobileApple=/iPad|iPhone|iPod/.test(navigator.userAgent);if(mobileApple){window.open(h.pdf,'_blank','noopener,noreferrer');return}$('#sheet').innerHTML=`<div class="row"><h2 class="spacer">Partitura ${h.number}</h2><button class="chip" onclick="window.open('${h.pdf}','_blank','noopener,noreferrer')">Abrir</button><button class="chip" onclick="openHymn('${id}')">Volver</button></div><iframe title="Partitura ${h.number}" src="${h.pdf}"></iframe>`}
function openVideo(id){let h=HYMNS.find(x=>x.id===id);$('#sheet').innerHTML=`<div class="row"><h2 class="spacer">Video ${h.number}</h2><button class="chip" onclick="openHymn('${id}')">Volver</button></div><video controls src="${h.video}"></video>`}
function closeModal(){$('#modal').classList.remove('open');render()}
async function checkUpdate(){try{let r=await fetch(UPDATE_URL+'?t='+Date.now()); if(r.status===404) return alert('No hay actualización publicada por ahora.'); let j=await r.json(); alert((j.version_code>BUILD?'Actualización disponible: ':'App actualizada. Versión: ')+(j.latest_version||j.version||VERSION));}catch(e){alert('No se pudo revisar la actualización. Revisa tu conexión.')}}
applyTheme();
render();
// Las búsquedas vuelven a dibujar su sección en cada pulsación. Restaurar el
// foco permite escribir frases completas también en Safari móvil.
document.addEventListener('input',event=>{let input=event.target;if(!(input instanceof HTMLInputElement)||!input.classList.contains('search'))return;let placeholder=input.placeholder,position=input.selectionStart??input.value.length;queueMicrotask(()=>{let next=[...document.querySelectorAll('input.search')].find(item=>item.placeholder===placeholder);if(next){next.focus({preventScroll:true});next.setSelectionRange(position,position)}})});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('play',()=>listenAudio.play());navigator.mediaSession.setActionHandler('pause',()=>listenAudio.pause());navigator.mediaSession.setActionHandler('nexttrack',()=>listenNext());navigator.mediaSession.setActionHandler('previoustrack',()=>listenPrevious())}catch(_){}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>

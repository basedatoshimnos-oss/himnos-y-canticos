do, tú, de su corazón el perfecto placer, ya en la eternidad habías tú pensado en este mundo, al cual querías descender.\n\n2. Con los hombres, Señor, delicias tú hallaste;\nquisiste aquí venir —¡oh misterio de amor!—.\nDios mismo preparó el cuerpo que tomaste,\ny en gran humillación naciste, oh Salvador.\n\n3. Contemplando, Señor, el miserable estado\n—¡abismo de maldad!— do estuvimos aquí,\nquisiste tú morir, librarnos del pecado\nque, por nos, en la cruz llevaste sobre ti.\n\n4. El sepulcro y Satán, por ti, fueron vencidos;\nsacaste a luz la vida y la inmortalidad.\nCual fruto de tu cruz tendrás tus redimidos\nmuy pronto en gloria, allá, por la eternidad.\n\n5. ¡Oh Cordero de Dios!, en gracia ya reinando,\ndigno eres de tomar potestad y honor;\nreunidos en tu paz, los tuyos, recordando\ntu cruz, tu inmolación, responden a tu amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/035%20-%20Hijo%20eterno%20de%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/35.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/35.mp4"},{"id":"hyc_revision_revisado_038","bookId":"hyc_revision","number":"36","title":"¡Santo, santo, santo!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Santo, santo, santo!\nHijo del Eterno, que hasta aquí viniste con gran humillación;\nen tu humana vida tú te has revelado cual Dios en el mundo, ¡bendita salvación!\n\n2. En la magna obra hecha en el Calvario\n—do tu cruenta muerte a Satanás venció—,\npor tu propia entrega Dios fue exaltado,\ny tu sacrificio la vida y paz nos dio.\n\n3. Cristo, coronado con suprema gloria\nque te dio el Padre en majestad real,\nsea a ti la honra por tu gran victoria;\ngracia y luz derramas del trono celestial.\n\n4. Hijo muy amado, el placer del Padre\nsiempre ha descansado en ti, Jesús Señor.\nEn ti recibimos inefables dones,\ny alegría eterna tendremos por tu amor.\n\n5. ¡Gloria, pues, al Padre que nos dio al Hijo,\ndon que es prueba cierta de cómo nos amó!\n¡Gloria a Jesucristo entre sus hermanos,\na quienes al Padre el Hijo reveló!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/036%20-%20%C2%A1Santo%2C%20santo%2C%20santo%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/36.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/36.mp4"},{"id":"hyc_revision_revisado_039","bookId":"hyc_revision","number":"37","title":"«Jesús» qué dulce nombre","type":"Revisado","topic":"Sin clasificar","lyric":"1. «Jesús», ¡qué dulce nombre a los que te queremos!\nPor tu amor, real loor por siempre te daremos.\nTus glorias celebramos, reunidos tus salvados, cual fruto de tu aflicción, en paz hoy te adoramos.\n\n2. «Jesús», ¡qué dulce nombre! Nos dice cuánto amas\nal pueblo aquí unido a ti; en su redor derramas\nel gozo de tu gracia, que inunda a tus amados,\nlos que hoy te dan adoración con fervoroso canto.\n\n3. «Jesús», ¡qué dulce nombre! Nos habla de tu vida:\ngracia y verdad, con potestad nos trajo tu venida.\nCual Hombre de dolores al mundo tú viniste;\nmas, por tu cruz, con clara luz, tu pueblo bendijiste.\n\n4. «Jesús», ¡qué dulce nombre! En tu excelsa vida,\ndivinidad y humanidad se vieron siempre unidas.\nTú revelaste al Padre, su grande amor mostraste;\nsu gracia acá, su gloria allá, tú solo desplegaste.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/037%20-%20%C2%ABJes%C3%BAs%C2%BB%20qu%C3%A9%20dulce%20nombre.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/37.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/37.mp4"},{"id":"hyc_revision_revisado_040","bookId":"hyc_revision","number":"38","title":"¡A ti loor, Señor Jesús!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡A ti loor, Señor Jesús!\nTe vemos exaltado, el Creador que, por amor, cual Siervo se ha humillado.\nEn ti podemos contemplar la imagen de Dios Padre: verdad y amor, ¡puro esplendor que en vil mundo ha brillado!\n\n2. De aquella eterna gloria que tenías con el Padre,\ntú fuiste hasta darte en cruz por la humanidad perdida.\nEn ti el pecado Dios cargó, la maldición llevaste;\nfue solo así, muriendo allí, que nuestra paz compraste.\n\n3. ¡Resucitaste, oh Jesús, y en gloria has ascendido!\nYa libres de condenación son todos tus redimidos.\nAllí, a la diestra de tu Dios, te encuentras exaltado;\nde Dios Cordero, vivo estás, tú, que fuiste inmolado.\n\n4. De aquella gloria celestial vendrás aquí a buscarnos,\ny, cual tu grey unida a ti, pacientes te esperamos.\nEntonces sí, sabremos bien la historia de tu gracia.\n¡Ven, pues, Señor, y de tu amor consuma tu victoria!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/038%20-%20%C2%A1A%20ti%20loor%2C%20Se%C3%B1or%20Jes%C3%BAs%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/38.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/38.mp4"},{"id":"hyc_revision_revisado_041","bookId":"hyc_revision","number":"39","title":"Señor, en este mundo visitaste","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, en este mundo visitaste al hombre corrompido en el pecado;\ndel cielo las verdades le anunciaste, que solo tú pudiste haberle dado.\nMas, siendo hostil tu entorno, al monte a orar subiste solo.\n\n2. La voluntad divina proseguiste,\npues solo tu podías consumarla.\nAún siendo aquella hora amarga y triste,\ndispuesto estabas tú para afrontarla.\nDel huerto solitario\nsubiste hasta la cumbre del Calvario.\n3. La amarga copa del divino juicio\ntú solo la bebiste en tu agonía;\ntú solo te ofreciste al sacrificio\nque Dios acepta y el pecado expía.\nTú solo fuiste fuerte,\nvenciendo al enemigo con tu muerte.\n\n4. Tu obra redentora incomparable\ntú solo la cumpliste con constancia;\ny, siendo ella sola aceptable,\ncon muchos gozarás de la ganancia.\nLos hombres rescatados\nserán los que tendrás siempre asociados.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/039%20-%20Se%C3%B1or%2C%20en%20este%20mundo%20visitaste.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/39.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/39.mp4"},{"id":"hyc_revision_revisado_042","bookId":"hyc_revision","number":"40","title":"¡Cuán fuerte eres, divino amor!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Cuán fuerte es el divino amor, esencia misma del Señor!\n¡Sí!, nuestro corazón en Gólgota lo comprendió: allí el amor de Cristo obró tan grande redención, tan grande redención.\n\n2. En vida y muerte vencedor,\n¡cuán poderoso es este amor!\nLos hijos de la luz\nen Cristo buscan sondear\nsu gran alcance y poder:\n¡misterio de la cruz! (bis)\n\n3. El Padre solo de este amor\nes quien conoce el valor\ny la inmensidad.\nAquí la Iglesia llena está\ndel grande amor, que llenará\ntambién la eternidad. (bis)","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/040%20-%20%C2%A1Cu%C3%A1n%20fuerte%20eres%2C%20divino%20amor%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/40.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/40.mp4"},{"id":"hyc_revision_revisado_043","bookId":"hyc_revision","number":"41","title":"Cristo de Dios, que de tan grande altura","type":"Revisado","topic":"Sin clasificar","lyric":"1. Cristo de Dios, que de tan grande altura bajaste para al hombre rescatar, pasaste por la prueba amarga y dura que, por amor, sufriste en su lugar.\n\n2. La horrenda cruz, Jesús, por nos sufriste,\ndesamparado por tu Dios allí;\nla muerte y sus terrores tú venciste,\nal recibir su golpe sobre ti.\n\n3. Con grande amor, oh Cristo, te entregaste,\nen cruz colgado, hecho maldición;\ntu propia sangre, el precio que pagaste,\nes nuestra paz y eterna salvación.\n\n4. Don celestial, el Hijo muy amado,\nte adoramos, ¡oh Señor Jesús!\nLoor al Padre que te ha enviado,\ny cuyo amor mostraste en la cruz.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/041%20-%20Cristo%20de%20Dios%2C%20que%20de%20tan%20grande%20altura.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/41.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/41.mp4"},{"id":"hyc_revision_revisado_044","bookId":"hyc_revision","number":"42","title":"De Dios Cordero santo y fiel","type":"Revisado","topic":"Sin clasificar","lyric":"1. De Dios Cordero santo y fiel, dejaste la gloria divina por una corona de espinas, rescatando a tu amada grey.\nSuban a ti, fiel Salvador, alegres himnos de victoria.\n¿Cuándo, ante el trono de la gloria, te alabaremos por tu amor? ¡Ven, pues, Señor! Amén, amén.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/042%20-%20De%20Dios%20Cordero%20santo%20y%20fiel.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/42.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/42.mp4"},{"id":"hyc_revision_revisado_045","bookId":"hyc_revision","number":"43","title":"Señor, ¡cuán insondable es tu divino amor!","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, ¡cuán insondable es tu divino amor!\nEterno e inmutable, motivo de loor;\namándonos bajaste a este mundo cruel;\ntu gracia desplegaste, bendito Emmanuel.\n\n2. Amándonos tomaste humana encarnación;\namándonos llevaste terrible maldición;\nsufriste el desamparo, la ira, el amargor,\na causa del pecado, en todo su rigor.\n\n3. Amándonos tú diste la vida en la cruz;\nel Sustituto fuiste allí, Señor Jesús.\nA ti por siempre unidos, del Padre mismo el don,\naquí hoy nos postramos con grata adoración.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/043%20-%20Se%C3%B1or%2C%20%C2%A1cu%C3%A1n%20insondable%20es%20tu%20divino%20amor%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/43.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/43.mp4"},{"id":"hyc_revision_revisado_046","bookId":"hyc_revision","number":"44","title":"Señor, hoy recordamos tu sufrimiento aquí","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, hoy recordamos tu sufrimiento aquí, el Sustituto santo, herida tu alma así;\nel cáliz de amargura, con plena sumisión, tú mismo lo agotaste, Señor, ¡qué redención!\n\n2. Las olas vengadoras de cólera penal\npor sobre ti pasaron con peso judicial;\ncon tu alma sumergida llevaste maldición,\ncargaste el pecado, por nuestra salvación.\n\n3. La muerte tú sondeaste en su profundidad,\npagando con tu vida la gran penalidad;\nmas ¿cuál no fue el tormento que tu alma allí sufrió,\ncuando el divino rostro de ti Dios apartó?\n\n4. ¡Qué gozo inefable el Padre en ti sintió\nal dar en cruz tu vida, y el suave olor subió!\nPerfume que hoy llena el cielo donde estás;\nallí, muy pronto, en gloria, contigo nos tendrás.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/044%20-%20Se%C3%B1or%2C%20hoy%20recordamos%20tu%20sufrimiento%20aqu%C3%AD.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/44.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/44.mp4"},{"id":"hyc_revision_revisado_047","bookId":"hyc_revision","number":"45","title":"Dios nos mostró de su amor la esencia","type":"Revisado","topic":"Sin clasificar","lyric":"1. Dios nos mostró de su amor la esencia: puro, eternal, de poder redentor, un don sin par de perfecta excelencia, amor que inflama a la grey del Señor.\n\n2. Con mansedumbre al Calvario subiste;\nde tu costado la sangre fluyó.\nY nuestras almas a ti atrajiste,\nque son el fruto de tu redención.\n\n3. ¡Grande es tu amor, poderosa tu gracia!\nTú nos salvaste de condenación;\nnos redimiste con toda eficacia,\ncuando en Gólgota hiciste expiación.\n\n4. Libres por fin (a Satán ya venciste),\ngloria te damos, Jesús, Redentor.\nSiempre tendrás a los que tú amaste,\nen luz eterna, alabando tu amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/045%20-%20Dios%20nos%20mostr%C3%B3%20de%20su%20amor%20la%20esencia.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/45.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/45.mp4"},{"id":"hyc_revision_revisado_048","bookId":"hyc_revision","number":"46","title":"Tus grandezas contemplamos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Tus grandezas contemplamos con profunda adoración;\ny, Señor Jesús, gozamos por ti suma bendición.\nEres entre tus hermanos la Primicia celestial, y tu Dios te ha coronado, dándote honra sin igual.\n\n2. Desde el seno de tu gloria, del descanso tuyo allí,\nlléganos la voz amada: «Por amor mi vida di».\nRespondiendo a tus anhelos, reunidos en amor,\nconocemos ese gozo que tú tienes, ¡oh Señor!\n\n3. Nuestro corazón se inclina ante ti en adoración;\ncentro tú eres en la gloria de la nueva creación.\nComo hijos nos presentas a tu Padre, ¡oh Señor!\nNuevo cántico se eleva, dulce son de eterno amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/046%20-%20Tus%20grandezas%20contemplamos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/46.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/46.mp4"},{"id":"hyc_revision_revisado_049","bookId":"hyc_revision","number":"47","title":"En noche triste, amarga","type":"Revisado","topic":"Sin clasificar","lyric":"1. En noche triste, amarga, por Judas entregado, creciendo aún la carga que habías de llevar, un memorial has dado, que al corazón aviva: Señor, te recordamos hasta tu regresar.\n\n2. Te vemos en el huerto, en tierra allí postrado,\nalzando al Padre el ruego, tú, solo en gran dolor;\npues ¿quién, en su agonía, el caliz de amargura,\nbeber en cruz podía en plena sumisión?\n\n3. De aquella lucha cruenta el fin es la victoria;\nla voluntad del Padre sumiso cumplirás.\nSí, de su amor supremo harás brillar la gloria:\nhasta el suplicio extremo por nos tú sufrirás.\n\n4. Hacia el madero cruento caminas tú, el Santo,\npues ya llegó el momento de ir hacia el altar.\nCordero inmolado, Dios es glorificado:\nél puede, por tu obra, al hombre así salvar.\n\n5. En ti, Jesús, ya vemos del grande amor las prendas:\ntenemos, por tu llaga, la vida y salvación.\nHasta la gran victoria, cuando del cielo vengas,\ntu Iglesia te da gloria, honor y adoración.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/047%20-%20En%20noche%20triste%2C%20amarga.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/47.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/47.mp4"},{"id":"hyc_revision_revisado_050","bookId":"hyc_revision","number":"48","title":"Jesús, Señor amado","type":"Revisado","topic":"Sin clasificar","lyric":"1. Jesús, Señor amado, a tu invitación nos hemos congregado en fraternal unión.\nSalvados por tu muerte y unidos en tu amor, nos regocija verte, objeto de loor.\n\n2. Llamados a tu cena que dispusiste aquí,\nrecuerdo bendecido, Señor Jesús, de ti;\nquedamos admirados al ver tu inmenso amor,\nprobado por tu muerte, bendito Salvador.\n\n3. Gozamos al sentarnos de ti alrededor,\naquí donde tu gracia nos dio lugar, Señor;\ntu Espíritu nos guía, según tu voluntad,\nvaliéndose de todos, según Su facultad.\n\n4. Ya miembros de tu cuerpo, teniendo en ti el vivir;\nde muerte hasta los cielos nos has hecho subir.\nLoamos tus prodigios, oh Cristo Salvador,\ntú, del gran Dios la gloria y manantial de amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/048%20-%20Jes%C3%BAs%2C%20Se%C3%B1or%20amado.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/48.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/48.mp4"},{"id":"hyc_revision_revisado_051","bookId":"hyc_revision","number":"49","title":"En esa misma noche","type":"Revisado","topic":"Sin clasificar","lyric":"1. En esa misma noche en que, Señor Jesús, pasaba por tu alma la sombra de la cruz, «Haced vosotros esto», dijiste tú allí;\nlo hacemos en memoria, Señor Jesús, de ti.\n\n2. Señor, cuan insondable e intenso tu dolor:\n¡la copa sin alivio bebiste en tu aflicción!,\npor Dios desamparado en vergonzosa cruz.\nA ti hoy recordamos con toda gratitud.\n\n3. Tu alma fue rodeada por densa oscuridad;\nlas olas te azotaban cual dura tempestad.\nTu infinita gracia y amor mostraste allí;\ntristeza y gozo se unen al recordarte así.\n\n4. Te vemos hoy en gloria, de muerte el vencedor;\nCabeza de tu Iglesia, su guía y precursor.\nEn ti, por gracia aceptos, tu amor nos hace aquí\npensar en tus angustias y recordarte así.\n\n5. Y hasta que tú vuelvas, rodeado de esplendor,\nseguimos anunciando tu muerte, oh Señor;\ny a esa misma muerte quisiéramos aquí\nestar más conformados, al recordarte a ti.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/049%20-%20En%20esa%20misma%20noche.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/49.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/49.mp4"},{"id":"hyc_revision_revisado_052","bookId":"hyc_revision","number":"50","title":"Señor, tú nos invitas","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, tú nos invitas la cena a celebrar;\nen paz tú nos congregas a tu favor gozar.\nTomando nuestra suerte, nos diste, ¡oh Señor!\nemblemas de tu muerte por festival de amor.\n\n2. Tu cuerpo lacerado nos trajo salvación;\nel pan tú nos has dado por santa comunión.\nLa copa de amargura bebiste, oh Jesús,\nmas cáliz de dulzura nos diste por tu cruz.\n\n3. Tu obra, consumada en su totalidad,\nha abierto libre entrada a tu felicidad.\nNo solamente vemos tus hechos, oh Señor;\nahora conocemos tu corazón de amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/050%20-%20Se%C3%B1or%2C%20t%C3%BA%20nos%20invitas.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/50.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/50.mp4"},{"id":"hyc_revision_revisado_053","bookId":"hyc_revision","number":"51","title":"A recordarte a ti","type":"Revisado","topic":"Sin clasificar","lyric":"1. A recordarte a ti, Señor, tú nos convidas, amante y buen Pastor, potente Redentor.\nEn medio del erial nos tiendes esta mesa, que proclama tu grande amor, que proclama tu grande amor.\n\n2. Contigo, ¡oh Salvador!, en dulce paz queremos\ntu muerte recordar, la cruz y tu dolor.\nPartimos este pan, la copa aquí bebemos,\nque proclaman tu grande amor, (bis).\n\n3. De nuestra iniquidad la carga vil, impuesta,\na tu alma estremeció con indecible horror;\nmas, ya triunfante tú, gozamos de la fiesta\nque proclama tu grande amor, (bis).\n\n4. Bendito Salvador, te vemos en la gloria,\ny hoy tu cena aquí gustamos, oh Señor.\nCumplido en breve ya el viaje peregrino,\nsondearemos tu grande amor, (bis).\n\n5. ¡A ti adoración, Jesús, tan fiel y amante!\nSin sombra, a nuestra vez, te hemos de ver, Señor.\nTu Iglesia, en plena luz, por gracia allá triunfante,\na tus pies cantará tu amor, (bis).","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/051%20-%20A%20recordarte%20a%20ti.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/51.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/51.mp4"},{"id":"hyc_revision_revisado_054","bookId":"hyc_revision","number":"52","title":"Nos muestras, oh Señor","type":"Revisado","topic":"Sin clasificar","lyric":"1. Nos muestras, oh Señor, nos muestras, oh Señor, la entrega de ti mismo, el precio de tu Iglesia;\ndulcísimo evocar, dulcísimo evocar: la mesa que hoy nos preparas, Jesús —¡oh Señor de gloria!—, recuerda tu dolor, tu muerte y tu amor, recuerda tu dolor, tu muerte y tu amor.\n\n2. La copa y este pan (bis), que, en tu amor, nos tiendes,\nde gracia pura y digna son prenda cierta y fiel (bis).\nEn su silente lenguaje recuerdan, por las edades,\nal salvo por la cruz: tu amor, Señor Jesús (bis).\n\n3. ¡Unánimes cantad (bis) del insondable amor y\nla gracia inefable de nuestro Redentor (bis)!\nSí, demos gloria y honores, alegres los corazones,\ny llenos de su amor, a Cristo, el Vencedor (bis).","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/052%20-%20Nos%20muestras%2C%20oh%20Se%C3%B1or.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/52.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/52.mp4"},{"id":"hyc_revision_revisado_055","bookId":"hyc_revision","number":"53","title":"Respondiendo a tu deseo","type":"Revisado","topic":"Sin clasificar","lyric":"1. Respondiendo a tu deseo, llega hoy tu grey, Señor;\nprueba el gozo de tu cena, fiel recuerdo de tu amor.\nDe tu obra en el Calvario goza el bien tu Iglesia acá, y tu sacrificio anuncia, tu victoria ensalza ya.\n\n2. Recordamos tus angustias, ¡oh divino Redentor!:\ntu dolor, tu afán, tu copa, tu agonía y tu clamor.\nPor los tuyos el castigo apuraste en dura cruz;\nya gozamos hoy contigo comunión en santa luz.\n\n3. Paz y dicha inefable da, Jesús, tu comunión;\nde tu amor, que es insondable, disfrutamos hoy el don.\nSantos, de común acuerdo, demos honra y gratitud:\n¡Al Cordero inmolado sea gloria en plenitud!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/053%20-%20Respondiendo%20a%20tu%20deseo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/53.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/53.mp4"},{"id":"hyc_revision_revisado_056","bookId":"hyc_revision","number":"54","title":"Reunidos, tus hermanos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Reunidos, tus hermanos, a partir el pan, Señor, comunión contigo tenemos al gozar aquí tu amor.\n\n2. ¡Oh, Jesús!, morir quisiste\nen la cruz; y, con dolor,\ntu precioso cuerpo entregaste\npor salvar al pecador.\n\n3. Recordamos tus dolores,\ntus angustias ¡oh, Jesús!,\ny tu cáliz que apuraste\nhasta el fin, allí en la cruz.\n\n4. Oh Señor, de tu herida\nsangre eficaz fluyó;\nnos dio vida, rasgó el velo,\npaz brindó y el cielo abrió.\n\n5. Dios así nos ha otorgado\ntan suprema salvación;\nen tu cruz —oh, Hijo amado—,\nél mostró su corazón.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/054%20-%20Reunidos%2C%20tus%20hermanos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/54.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/54.mp4"},{"id":"hyc_revision_revisado_057","bookId":"hyc_revision","number":"55","title":"Recordándote, Señor","type":"Revisado","topic":"Sin clasificar","lyric":"1. Recordándote, Señor, en tu muerte de dolor, por salvar al pecador, ¡te adoramos, Salvador!\n\n2. En tu cruz, Señor Jesús,\nvasto amor se nos mostró,\ncuando Dios te abandonó.\n¡Te adoramos, Salvador!\n\n3. Levantado ahora estás;\nsiempre en gloria reinarás;\nen tu amor nos guardarás.\n¡Te adoramos, oh Señor!\n\n4. Pronto, completada ya,\ntu Iglesia subirá,\ny tu gloria gozará.\n¡Te adoramos, oh Señor!\n\n5. Hasta entonces, tú nos das\nel gustar, una vez más,\nde los símbolos de amor,\nde tu mesa alrededor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/055%20-%20Record%C3%A1ndote%2C%20Se%C3%B1or.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/55.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/55.mp4"},{"id":"hyc_revision_revisado_058","bookId":"hyc_revision","number":"56","title":"Tú, que en el cielo estás","type":"Revisado","topic":"Sin clasificar","lyric":"1. Tú, que en el cielo estás, has preparado, en gloria, nuestro lugar allí, contigo, oh Salvador.\nQueremos celebrar tu gracia y tu justicia;\ntu muerte recordar y tu inefable amor;\ntu muerte recordar y tu inefable amor.\n\n2. Reunidos hoy, Señor, gozamos tu presencia,\n—¡dulce y preciosa es tu santa comunión!—;\nMas, todavía aquí, sentimos tu ausencia,\nansiando el día aquel de la gran reunión. (bis)\n\n3. ¡Oh, qué solemnidad! Entrando tu esposa,\ntú la recibirás —los cielos lo verán—;\nen tu festín nupcial, sin mancha y gloriosa,\ntu gloria y tu paz sin fin la colmarán. (bis)\n\n4. Hasta el momento en que tu rostro al fin veamos,\ngustamos del festín que preparó tu amor;\ny, por medio de él, tu muerte hoy anunciamos;\npor fe te vemos ya, volviendo en tu esplendor. (bis)","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/056%20-%20T%C3%BA%2C%20que%20en%20el%20cielo%20est%C3%A1s.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/56.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/56.mp4"},{"id":"hyc_revision_revisado_059","bookId":"hyc_revision","number":"57","title":"No fue por nuestro amor a Dios","type":"Revisado","topic":"Sin clasificar","lyric":"1. No fue por nuestro amor a Dios que el Padre a su Hijo dio...\n¿Cuál es la fuente de ese amor? ¡Tu corazón!\n\n2. Señor Jesús, ¡qué grande amor\nte trajo y nos ganó!\nLa cruz, su oprobio y su dolor,\ntu amor venció.\n\n3. Desamparado fuiste tú\nen Gólgota por Dios;\ny por tu muerte, oh Jesús,\nél nos salvó.\n\n4. «¡Cumplido está!»,\npotente voz, ¡el velo se rasgó!\nOh Redentor, tu obra a Dios\nnos acercó.\n\n5. Hoy, ante el trono, ¡oh Salvador!,\nqueremos adorar,\nrendirnos a tu gran amor\ny gracias dar.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/057%20-%20No%20fue%20por%20nuestro%20amor%20a%20Dios.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/57.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/57.mp4"},{"id":"hyc_revision_revisado_060","bookId":"hyc_revision","number":"58","title":"¡Rasgóse el velo!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Rasgóse el velo!\nYa no más distancia mediará;\nal trono mismo de su Dios, el alma llegará.\n\n2. ¡Rasgóse el velo! ¡Sombras, id!\nLa luz resplandeció;\nel rostro mismo de su Dios\nJesús ya reveló.\n\n3. ¡Rasgóse el velo! hecha está\neterna redención;\nel alma, pura y limpia ya,\nno teme perdición.\n\n4. ¡Rasgóse el velo! Dios abrió\nlos brazos de su amor;\nentrar podemos donde entró\nJesús, el Salvador.\n\n5. Entremos, pues, —¡oh, adorad\nal Dios de amor y luz!—;.\ncon gozo, allí las gracias dad\nen nombre de Jesús.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/058%20-%20%C2%A1Rasg%C3%B3se%20el%20velo%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_58.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_58.mp4"},{"id":"hyc_revision_revisado_061","bookId":"hyc_revision","number":"59","title":"¡Cuán inefable es el divino amor!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Cuán inefable es el divino amor!\n¡Cuán grande es, cuán digno de loor!\nPuro, esplendente en la redención, es manantial de toda bendición.\n\nCoro:\n¡Oh Jesús glorioso!, el triunfo del amor verás;\npronto, a los que tú amas, junto a ti tendrás.\n\n2. Misericordia relució en la cruz;\ncon la verdad se unió, —¡oh Señor Jesús! —;\ny se han besado allí justicia y paz.\n¡Mostraste así tu gracia eficaz!\n\n3. En ese hogar de gracia y santidad,\nen tu esplendor, tu gloria y majestad,\ntu Iglesia allí su amor te ofrecerá,\ncual nardo que a tus pies derramará.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/059%20-%20%C2%A1Cu%C3%A1n%20inefable%20es%20el%20divino%20amor%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_59.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_59.mp4"},{"id":"hyc_revision_revisado_062","bookId":"hyc_revision","number":"60","title":"Voz de amor, con gran potencia","type":"Revisado","topic":"Sin clasificar","lyric":"1. Voz de amor, con gran potencia, en el Gólgota sonó;\ny, al oírla, con violencia el Calvario retembló: «¡Consumado es!», «¡Consumado es!», fue la voz que Cristo dio.\n\n2. En angustias y dolores, sin amparo se encontró\nel Señor de los señores, el que nuestro mal llevó.\n«¡Consumado es!», «¡Consumado es!»,\ny su espíritu entregó.\n\n3. La sentencia es consumada, el Pastor herido está;\nla serpiente, quebrantada la cabeza tiene ya.\n«¡Consumado es!», «¡Consumado es!»,\ncuanto al hombre vida da.\n\n4. Ya la muerte está vencida, no infunde más temor;\n¡puede el alma redimida alabar a su Señor!\n«¡Consumado es!», «¡Consumado es!»,\nel rescate de amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/060%20-%20Voz%20de%20amor%2C%20con%20gran%20potencia.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_60.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_60.mp4"},{"id":"hyc_revision_revisado_063","bookId":"hyc_revision","number":"61","title":"Vemos a Jesús, dotado del poder","type":"Revisado","topic":"Sin clasificar","lyric":"1. Vemos a Jesús, dotado del poder que Dios le dio, pero siempre recordamos que la muerte aquí sufrió.\n\n2. Cada signo de deshonra,\nsus angustias, su dolor\nhoy encuentran recompensa\nen el paternal favor.\n\n3. Quien en cruz fue abandonado,\nsin tener consolación,\nhoy se halla entronizado\ncon real adoración.\n\n4. Quien llevó de aguda espina\nla corona con dolor,\ncelestial diadema lleva,\nla del Hombre vencedor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/061%20-%20Vemos%20a%20Jes%C3%BAs%2C%20dotado%20del%20poder.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_61.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_61.mp4"},{"id":"hyc_revision_revisado_064","bookId":"hyc_revision","number":"62","title":"En la cruz, mirad clavado","type":"Revisado","topic":"Sin clasificar","lyric":"1. En la cruz, mirad clavado a Jesús, el Salvador;\nved qué prueba nos ha dado de su celestial amor.\n\n2. Al pagar el gran rescate,\nsu preciosa sangre dio;\ny, venciendo en el combate,\na la muerte anuló.\n\n3. En sus cárceles, la muerte\nno le pudo retener,\npues Jesús, con mano fuerte,\nacabó con su poder.\n\n4. Alabemos al Cordero\nque nos ama y nos amó;\ny, muriendo en el madero,\nnuestras almas rescató.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/062%20-%20En%20la%20cruz%2C%20mirad%20clavado.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_62.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_62.mp4"},{"id":"hyc_revision_revisado_065","bookId":"hyc_revision","number":"63","title":"Tu muerte nos salvó","type":"Revisado","topic":"Sin clasificar","lyric":"1. Tu muerte nos salvó, ¡glorioso Redentor!\nSe eleva el himno de tu amor con eternal fervor.\n\n2. Tu amor no rehusó\nbeber amarga hiel;\nni aún la muerte lo venció:\namor probado y fiel.\n\n3. Amor que anduvo aquí\nen triste soledad;\namor que siempre declaró\nla gracia y la verdad.\n\n4. Amor que en dura cruz\nperfumes exhaló;\nen densa noche de maldad\nla redención brilló.\n\n5. Vencido todo mal,\nal trono subirás;\ntu amor, en gloria celestial,\npor siempre mostrarás.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/063%20-%20Tu%20muerte%20nos%20salv%C3%B3.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_63.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_63.mp4"},{"id":"hyc_revision_revisado_066","bookId":"hyc_revision","number":"64","title":"El Señor resucitó","type":"Revisado","topic":"Sin clasificar","lyric":"1. El Señor resucitó, ¡aleluya, aleluya!, muerte y tumba ya venció, ¡aleluya, aleluya!\nCon su fuerza y su virtud, cautivó la esclavitud, sacó la vida a la luz. ¡Aleluya, aleluya!\n\n2. Como Siervo se humilló, ¡aleluya, aleluya!,\ny en la dura cruz sufrió, ¡aleluya, aleluya!\nDios lo alzó en majestad, con justicia y con verdad;\nle dió un nombre sin igual. ¡Aleluya, aleluya!\n\n3. Quien la culpa vil cargó, ¡aleluya, aleluya!,\ny a la muerte se entregó, ¡aleluya, aleluya!\nHoy, en vida triunfal, reina en gracia celestial\ncon paz divina y eternal. ¡Aleluya, aleluya!\n\n4. Cristo, nuestro Salvador, ¡aleluya, aleluya!,\nde Satán el Vencedor, ¡aleluya, aleluya!\nPronto, en gloria, y sin cesar tu Iglesia ha de cantar\ny tu victoria proclamar: ¡Aleluya, aleluya!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/064%20-%20El%20Se%C3%B1or%20resucit%C3%B3.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_64.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_64.mp4"},{"id":"hyc_revision_revisado_067","bookId":"hyc_revision","number":"65","title":"¡Resplandor del Dios de gloria!","type":"Revisado","topic":"Sin clasificar","lyric":"1. ¡Resplandor del Dios de gloria!\nElevamos la canción a Jesús,\npor su victoria que nos trajo salvación.\nDel celeste trono vino;\ny en Calvario se humilló\n(puro don de amor divino),\ny al morir en cruz triunfó.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/065%20-%20%C2%A1Resplandor%20del%20Dios%20de%20gloria%21.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_65.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_65.mp4"},{"id":"hyc_revision_revisado_068","bookId":"hyc_revision","number":"66","title":"En cruenta cruz murió Cristo, el Señor","type":"Revisado","topic":"Sin clasificar","lyric":"1. En cruenta cruz murió Cristo, el Señor;\nde nuestra culpa expió todo el horror.\n\nCoro:\nDesde la tumba subió, sí, triunfante, (él subió), él resucitó.\nEn celeste gloria, (resucitó).\ndonde ya está, a sus santos, victorioso él tendrá.\n¡Triunfó, ¡Triunfó, triunfó! ¡Aleluya, él triunfó! triunfó!\n\n2. La muerte y su aguijón Cristo quitó,\npues su dominio cruel, él ya venció.\n\n3. A Satanás venció Cristo el Señor;\nla salvación nos dio el Redentor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/066%20-%20En%20cruenta%20cruz%20muri%C3%B3%20Cristo%2C%20el%20Se%C3%B1or.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_66.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_66.mp4"},{"id":"hyc_revision_revisado_069","bookId":"hyc_revision","number":"67","title":"Rey de gloria, te adoramos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Rey de gloria, te adoramos, Cristo, soberano Dios;\nante ti hoy nos postramos elevando nuestra voz.\nLlena el cielo tu esplendor, ¡admirable Salvador!\n\n2. Rey eterno y soberano,\nheredero y Señor;\ntú sufriste el rechazo\ny el desprecio de tu amor.\nHoy, en gloria estás sentado,\n¡digno eres de loor!\n\n3. Tú, «la Vida», ¡en la muerte!;\ntú, «el Justo», ¡en la cruz!\nEl deleite de tu Padre,\n¡al altar fuiste, oh Jesús!\nPuro incienso es tu amor,\nque hoy te damos con fervor.\n\n4. Regias glorias tú mereces,\nregias honras tú tendrás;\ntú, el cetro de tu reino,\npronto aquí recibirás.\n¡Oh Cordero vencedor,\ncon justicia reinarás!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/067%20-%20Rey%20de%20gloria%2C%20te%20adoramos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_67.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_67.mp4"},{"id":"hyc_revision_revisado_070","bookId":"hyc_revision","number":"68","title":"De la Divinidad, plenitud inefable","type":"Revisado","topic":"Sin clasificar","lyric":"1. De la Divinidad, plenitud inefable;\nde potencia y amor, raudal inagotable, inagotable.\n¡Hijo eternal!, ¡Hijo eternal!\n¡Gloria celestial!, ¡Gloria celestial!\nOh, Jesús, en tu paz tu Iglesia amada te adora a ti, postrada;\ny en tu amor se goza, y en tu amor se goza.\n\n2. Estás, Señor Jesús, junto al Padre sentado,\ncon poder y honor, en gloria entronizado, entronizado.\n¡Dios Salvador!, ¡Dios Salvador!\n¡Cristo Vencedor!, ¡Cristo Vencedor!\nPor completo, ante ti, nuestro ser hoy se postra;\nte rinde gloria y honra,\nsu amor y su obediencia, su amor y su obediencia.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/068%20-%20De%20la%20Divinidad%2C%20plenitud%20inefable.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_68.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_68.mp4"},{"id":"hyc_revision_revisado_071","bookId":"hyc_revision","number":"69","title":"Cristo, nuestro Salvador, te adoramos con fervor","type":"Revisado","topic":"Sin clasificar","lyric":"1. Cristo, nuestro Salvador, te adoramos con fervor por tu sin igual amor\n\nCoro:\n¡Alabanzas al Cordero!\n\n2. Quien la muerte padeció,\nquien el juicio agotó,\ny al diablo derrotó\n\n3. «Hay un solo Mediador»:\ntú, el Hombre vencedor;\ncompetente Salvador\n\n4. Digno de honra y loor\neres por tu gran amor;\n¡Santo eres, oh Señor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/069%20-%20Cristo%2C%20nuestro%20Salvador%2C%20te%20adoramos%20con%20fervor.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_69.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_69.mp4"},{"id":"hyc_revision_revisado_071_numero_71","bookId":"hyc_revision","number":"71","title":"Señor, te adoramos, pues fuiste inmolado","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, te adoramos, pues fuiste inmolado;\nmas vives por siempre en gloria exaltado.\nEterno rescate tu sangre ha pagado;\ncon ella compraste a los que has salvado. ¡Oh Rey de justicia! ¡Autor de la paz!\n\n2. Tu cuerpo en ofrenda a Dios entregaste,\nsubió hacia el cielo perfume agradable;\n«Varón de dolores», aquí te humillaste.\nCon lágrimas en este mundo sembraste\nmas pronto con gozo tu mies llevarás.\n\n3. A ti sean gloria, poder y riqueza,\nla ciencia eterna y la fortaleza.\n¡Oh Rey de los siglos, Señor, Dios y Hombre!\nCordero inmolado, ¡honor a tu nombre!\nLa Iglesia te adora por siempre. ¡Amén!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/071%20-%20Se%C3%B1or%2C%20te%20adoramos%2C%20pues%20fuiste%20inmolado.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_71.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_71.mp4"},{"id":"hyc_revision_revisado_072","bookId":"hyc_revision","number":"72","title":"Venid, nuestras voces","type":"Revisado","topic":"Sin clasificar","lyric":"1. Venid, nuestras voces alegres unamos al coro que alaba al gran Vencedor;\nsus voces se cuentan por miles de miles, mas todas se inflaman en un mismo amor.\n\n2. «Es digno el Cordero que ha muerto», proclaman,\n«de estar exaltado en los cielos así».\n«Es digno el Cordero», decimos nosotros,\n«que fue por su pueblo inmolado aquí».\n\n3. A ti pertenecen la sabiduría,\nla gloria, riquezas, poder y honor.\n¡Jesús, eres digno de toda alabanza!\n¡Por siempre se eleve a tu trono, Señor!","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/072%20-%20Venid%2C%20nuestras%20voces.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_72.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_72.mp4"},{"id":"hyc_revision_revisado_073","bookId":"hyc_revision","number":"73","title":"Venid con cánticos","type":"Revisado","topic":"Sin clasificar","lyric":"1. Venid con cánticos, ve nid, del trono alrededor;\nhonores con fervor ren did, a Cristo, el Salvador;\nhonores con fervor rendida Cristo, el Salvador.\n\n2. En Gólgota él agotó la copa de amargor,\nasí al hombre vida dio: ¡cuán digno es el Señor! (bis)\n\n3. Cantad, hermanos, por doquier, cantadle con fervor;\nél siempre es digno de poder, riquezas y loor. (bis)","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/073%20-%20Venid%20con%20c%C3%A1nticos.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_73.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_73.mp4"},{"id":"hyc_revision_revisado_074","bookId":"hyc_revision","number":"74","title":"Gloria sea, gloria eterna","type":"Revisado","topic":"Sin clasificar","lyric":"1. Gloria sea, gloria eterna a Jesús, al que murió, al que, por amor perfecto, su preciosa vida dio.\n¡Gloria sea, gloria eterna al que así nos rescató!\n¡Gloria sea, gloria eterna al que así nos rescató!\n\n2. Sí, su amor es verdadero;\nnada lo pudo apartar;\nfirme anduvo hasta el madero,\nsiempre fiel, sin vacilar.\n¡Gloria sea, gloria eterna\nal que así nos supo amar! (bis)\n\n3. De ese amor, ved la victoria\nque en la cruz se consumó,\ny en el trono ved la gloria\ndel que obró la salvación.\n¡Gloria sea, gloria eterna,\ngloria a ti, Señor Jesús! (bis)","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/074%20-%20Gloria%20sea%2C%20gloria%20eterna.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_74.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_74.mp4"},{"id":"hyc_revision_revisado_075","bookId":"hyc_revision","number":"75","title":"Señor, en este mundo","type":"Revisado","topic":"Sin clasificar","lyric":"1. Señor, en este mundo tú fuiste despreciado;\nninguna hermosura en ti supieron ver;\nmas siempre tú has sido el Hijo muy amado, delicias de tu Padre y su cabal placer.\n\n2. Tú, Hombre de dolores, humilde y fiel Cordero,\nsufriste de los hombres, la muerte y aflicción;\npor Dios desamparado te viste en el madero;\npor nuestras transgresiones hiciste la expiación.\n\n3. Subiste de la tumba, oh Cristo victorioso;\nlas glorias han seguido a aquella cruenta cruz.\nDios mismo te ha dado, el Nombre más glorioso,\ny te ha enaltecido a su diestra, oh Jesús.\n\n4. Verás, Señor, el fruto de la aflicción de tu alma,\nteniendo a tus amados en célico esplendor;\ntendrás en tu presencia a tu esposa muy amada,\ngloriosa y sin mancha, para ensalzar tu amor.","pdf":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/partituras/075%20-%20Se%C3%B1or%2C%20en%20este%20mundo.pdf","audio":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/audio/Himno_75.mp3","video":"https://pub-714ad0c68bc448819cdc25f539866c98.r2.dev/video/Himno_75.mp4"},{"id":"corario_ninos_001","bookId":"corario_ninos","number":"1","title":"Jesús me ama","type":"Niños","topic":"Niños","lyric":"Jesús me ama, ¡suprema dicha!\nJesús me ama, ¡qué grande amor!\nSiempre yo lo diré: Jesús me ama,\nJesús me ama, ¡qué grande amor!","pdf":"","audio":"","video":""},{"id":"corario_ninos_002","bookId":"corario_ninos","number":"2","title":"Soy una florcita","type":"Niños","topic":"Niños","lyric":"Soy una florcita de Jesús\nAbro la boca para cantar,\nCierro los ojos para orar\nSoy una florcita de Jesús,\nSi, de Jesús.","pdf":"","audio":"","video":""},{"id":"corario_ninos_003","bookId":"corario_ninos","number":"3","title":"Yo tengo un amigo que me ama","type":"Niños","topic":"Niños","lyric":"Yo tengo un amigo que me ama, me ama, me ama.\nYo tengo un amigo que me ama, su nombre es Jesús.\nTú tienes un amigo que te ama, te ama, te ama.\nTú tienes un amigo que te ama, su nombre es Jesús.\nTenemos un amigo que nos ama, nos ama, nos ama.\nTenemos un amigo que nos ama, su nombre es Jesús.","pdf":"","audio":"","video":""},{"id":"corario_ninos_004","bookId":"corario_ninos","number":"4","title":"Jonás","type":"Niños","topic":"Niños","lyric":"Jonás no le hizo caso a la Palabra de Dios,\nPor eso a un mar profundo, la gente lo tiró;\nY vino un pez muy grande, y ¡glup! Se lo tragó,\nPorque no le hizo caso a la Palabra de Dios,\nPorque no le hizo caso a la Palabra de Dios.\nJonás estuvo ahí, tres días en el pez\nY cuando él oró, el pez lo devolvió;\nEntonces así Jonás, a Dios obedeció\nY muchos niños más recibieron al Señor,\nY muchos niños más recibieron al Señor.","pdf":"","audio":"","video":""},{"id":"corario_ninos_005","bookId":"corario_ninos","number":"5","title":"Era un muchachito","type":"Niños","topic":"Niños","lyric":"Era un muchachito de nombre David,\nEra un muchachito que mucho a Dios amó,\nY ese muchachito no se asustó,\nCuando vio al gigante,\nQue a otros miedo dio.\nY una piedrita puso en la onda, cual Dios le mandó;\nY otra piedrita puso en la onda, cual Dios le mandó\nY vuelta, y vuelta, y vuelta y vuelta dio.\nY esa piedrita voló por los aires;\nY al gigante derribó.","pdf":"","audio":"","video":""},{"id":"corario_ninos_006","bookId":"corario_ninos","number":"6","title":"Martillo es la Biblia","type":"Niños","topic":"Niños","lyric":"Martillo es la Biblia, \nque quiebra el corazón;\ncual luz en el camino,\ny un faro en la alta mar;\nespada de dos filos,\ny espejo mi mal a ver. \nEl libro de los libros\nes la Biblia para mí.","pdf":"","audio":"","video":""},{"id":"corario_ninos_007","bookId":"corario_ninos","number":"7","title":"Tres palabritas solas","type":"Niños","topic":"Niños","lyric":"Tres palabritas solas\nyo aprendí muy bien:\n“Dios es amor”.\nDebes aprenderlas tú también.","pdf":"","audio":"","video":""},{"id":"corario_ninos_008","bookId":"corario_ninos","number":"8","title":"Somos soldaditos","type":"Niños","topic":"Niños","lyric":"Somos soldaditos, siervos del Señor.\nVamos en defensa de nuestro evangelio.\nTa-ta-ra-ra-ta-ta-ta, Ta-ta-ra-ra-ta-ta-ta,\ny ganaremos la victoria con Jesús.\nAunque no soy de la infantería,\ncaballería, artillería.\nAunque en avión no vaya volando,\npero soldado soy.\n¡Soldado soy de Jesús!\n¡Soldado soy de Jesús!\nAunque no soy de la infantería,\ncaballería, artillería.\nAunque en avión no vaya volando,\npero soldado soy.","pdf":"","audio":"","video":""},{"id":"corario_ninos_009","bookId":"corario_ninos","number":"9","title":"Era un barquito","type":"Niños","topic":"Niños","lyric":"Era un barquito que en el mar se iba a hundir,\npero a Jesús por capitán, yo recibí.\nNo temo ahora naufragar, pues guía él,\ny a la gloria por su amor arribaré.\nJesús desea en su amor poder salvar\na cuantos niños su timón le quieran dar.\nSólo hace falta tener fe, pues él murió\nen una cruz para salvar al pecador.","pdf":"","audio":"","video":""},{"id":"corario_ninos_010","bookId":"corario_ninos","number":"10","title":"He aquí Jesús a tu puerta está","type":"Niños","topic":"Niños","lyric":"He aquí Jesús a tu puerta está,\na la puerta de tu corazón;\nno le dejes ir sin tu puerta abrir\nsi deseas la salvación.\nPues, abre, abre,\ndeja al Salvador entrar,\ny por siempre jamás feliz serás\nsi dejares a Cristo entrar.","pdf":"","audio":"","video":""},{"id":"corario_ninos_011","bookId":"corario_ninos","number":"11","title":"Él quiere, desea y puede salvarte","type":"Niños","topic":"Niños","lyric":"Él quiere, desea y puede salvarte\nsi sólo confías en Él.\nÉl quiere, desea y puede salvarte\nsi sólo confías en Él.\nNo hay nada que comprar,\nno hay nada que pagar;\nen la cruz Cristo exclamó:\n\"Ya consumado está\".\nPor eso Él quiere,\ndesea y puede salvarte,\nsi sólo confías en Él.","pdf":"","audio":"","video":""},{"id":"corario_ninos_012","bookId":"corario_ninos","number":"12","title":"Una vez perdido","type":"Niños","topic":"Niños","lyric":"Una vez perdido vivía yo,\nlejos y vagante en error;\nmas la voz de Cristo me alcanzó,\nme llamó con tierno amor.\nHay un nombre nuevo en la gloria;\nmio es, sí, mío es;\ny los ángeles a Dios dan gloria,\nsalvo es el pecador.\nHay un nombre nuevo en la gloria,\nmío es, sí, mío es;\ntodos mis pecados ya son perdonados, ¡gloria pues a él!\nEn la Biblia dice que salvo soy;\npor la gracia me redimió;\ny por fe en su nombre a la gloria voy porque Él me rescató.","pdf":"","audio":"","video":""},{"id":"corario_ninos_013","bookId":"corario_ninos","number":"13","title":"Lámpara es a mis pies","type":"Niños","topic":"Niños","lyric":"Lámpara es a mis pies tu Palabra, y lumbrera a mi camino.\nEl Dios de paz siempre me guarda. Lámpara es a mis pies tu Palabra.","pdf":"","audio":"","video":""},{"id":"corario_ninos_014","bookId":"corario_ninos","number":"14","title":"En la roca eterna edificaré","type":"Niños","topic":"Niños","lyric":"En la roca eterna yo edificaré,\nla arena movediza nunca escogeré.\nLas lluvias vendrán y el feroz temblor, mi vida está fundada sobre el Salvador.","pdf":"","audio":"","video":""},{"id":"corario_ninos_015","bookId":"corario_ninos","number":"15","title":"Estoy contento y te diré por qué","type":"Niños","topic":"Niños","lyric":"Estoy contento y te diré por qué:\nsé que Jesucristo me salvó.\nDe su gracia siempre cantaré,\nsé que Jesucristo me salvó.\nLa tremenda carga de mi corazón,\nCristo la tornó en dulce bendición.\nEstoy contento y te diré por qué:\nsé que Jesucristo me salvó.","pdf":"","audio":"","video":""},{"id":"corario_ninos_016","bookId":"corario_ninos","number":"16","title":"Somos un pequeño pueblo","type":"Niños","topic":"Niños","lyric":"Somos un pequeño pueblo muy feliz, somos un pequeño pueblo muy feliz.\nEl Señor es nuestro guía,\ny nos colma de alegría,\nsomos un pequeño pueblo muy feliz. ¡Oh, sí!","pdf":"","audio":"","video":""},{"id":"corario_ninos_017","bookId":"corario_ninos","number":"17","title":"Buscad primero","type":"Niños","topic":"Niños","lyric":"Buscad primero el reino de Dios\ny su perfecta justicia,\ny lo demás añadido será.\n¡Aleluya!\nNo sólo de pan el hombre vivirá\nsino de toda palabra\nque sale de la boca de Dios.\n¡Aleluya!","pdf":"","audio":"","video":""},{"id":"corario_ninos_018","bookId":"corario_ninos","number":"18","title":"Oh ven a conocer","type":"Niños","topic":"Niños","lyric":"¡Oh ven a conocer a mi Salvador,\na mi Salvador, a mi Salvador!\n¡Oh ven a conocer a mi Salvador,\ny tendrás su dulce paz!","pdf":"","audio":"","video":""},{"id":"corario_ninos_019","bookId":"corario_ninos","number":"19","title":"Sobre los prados","type":"Niños","topic":"Niños","lyric":"Sobre los prados pusiste, Señor,\nel poder sin igual de tu mano.\nLos arroyos y cerros, tú los formaste.\n¡Oh, Dios, pon tu mano sobre mí!\nHaces las nubes llover y los ríos correr para llenar el mar; vida abundante quieres dar. Dominas Tú sobre el cielo y la tierra.\n¡Oh, Dios, pon tu mano sobre mí!","pdf":"","audio":"","video":""},{"id":"corario_ninos_020","bookId":"corario_ninos","number":"20","title":"Demos gracias al Señor","type":"Niños","topic":"Niños","lyric":"Demos gracias al Señor, demos gracias, demos gracias por su amor.\nDemos gracias al Señor, demos gracias, demos gracias por su amor.\nPor las mañanas, las aves cantan\nlas alabanzas a Dios el Creador.\nY tú, amigo, ¿por qué no cantas\nlas alabanzas a Cristo el Salvador?","pdf":"","audio":"","video":""},{"id":"corario_ninos_021","bookId":"corario_ninos","number":"21","title":"Todo niño necesita","type":"Niños","topic":"Niños","lyric":"Todo niño necesita\nconocer al Salvador.\nDice Él que cada uno\nes objeto de su amor.\nAlguien debe hoy decirles\nque Jesús su vida dio\npara darles vida eterna porque tanto los amó.","pdf":"","audio":"","video":""},{"id":"corario_ninos_022","bookId":"corario_ninos","number":"22","title":"Me guía Él","type":"Niños","topic":"Niños","lyric":"Me guía Él, con cuánto amor, me guía siempre mi Señor; en todo tiempo puedo ver con cuánto amor me guía Él.\nMe guía Él, me guía Él, con cuánto amor me guía Él; no abrigo dudas ni temor, pues me conduce el buen Pastor.\nLa mano quiero yo tomar de Cristo; nunca vacilar, cumpliendo con fidelidad su sabia y santa voluntad.","pdf":"","audio":"","video":""},{"id":"corario_ninos_023","bookId":"corario_ninos","number":"23","title":"Quiere Jesús que yo brille","type":"Niños","topic":"Niños","lyric":"Quiere Jesús que yo brille mientras que viva acá, y que le complazca siempre en clase, juego, hogar.\n¡Brillando! ¡Brillando! Quiere Jesús que yo brille. ¡Brillando! ¡Brillando! Yo brillaré para él.\nPediré a Cristo su ayuda, y limpio corazón, imitaré su dulzura brillando para él.","pdf":"","audio":"","video":""},{"id":"corario_ninos_024","bookId":"corario_ninos","number":"24","title":"Dios es amor","type":"Niños","topic":"Niños","lyric":"Dios es amor, Dios es amor, la Biblia lo dice;\nDios es amor, Dios es amor, Pablo lo repite.\nDios es amor, Dios es amor, nadie lo merece;\nDice el capítulo cuatro, versículo ocho, primera de Juan.","pdf":"","audio":"","video":""},{"id":"corario_ninos_025","bookId":"corario_ninos","number":"25","title":"¡Oh niños acudid!","type":"Niños","topic":"Niños","lyric":"¡Oh, niños, acudid, vamos a empezar para todos de la Biblia la lección!\nA fin de conocer de Dios el amor,\nsu Palabra hoy debemos escuchar.\nEste Libro es lámpara a mis pies,\nfaro de divina claridad.\n¡Oh, niños, escuchad con gran atención, que ya empieza de la Biblia la lección!","pdf":"","audio":"","video":""},{"id":"corario_ninos_026","bookId":"corario_ninos","number":"26","title":"Zaqueo","type":"Niños","topic":"Niños","lyric":"Un hombre chiquito,\nera Zaqueo,\nun hombre chiquito así.\nSubió a un árbol,\npara mirar,\na Cristo que pasaba por allí.\nY cuando Cristo\nmiró para arriba,\ny vió al hombrecito allí.\nLe dijo:\n“¡Zaqueo, bájate, apúrate!\nQue voy a tu casa contigo,\nque voy a tu casa contigo”.","pdf":"","audio":"","video":""},{"id":"corario_ninos_027","bookId":"corario_ninos","number":"27","title":"Jesucristo ha venido","type":"Niños","topic":"Niños","lyric":"Jesucristo ha venido\nen busca de joyas.\nTodo niño redimido\nsu joya será.\nComo estrellas que brillan,\nson los niños que le aman,\nLos tesoros que adornan\nal gran Salvador.\nTanto niños como niñas\nque acuden a Cristo\nSon las joyas escogidas\npreciosas a El.","pdf":"","audio":"","video":""},{"id":"corario_ninos_028","bookId":"corario_ninos","number":"28","title":"Te doy mi corazón Jesús","type":"Niños","topic":"Niños","lyric":"Te doy mi corazón, Jesús;\nte doy mi corazón, Jesús.\nTransfórmalo, Señor,\ny llénalo de luz;\nte doy mi corazón, Jesús.","pdf":"","audio":"","video":""},{"id":"corario_ninos_029","bookId":"corario_ninos","number":"29","title":"Hoy, ayer y por los siglos","type":"Niños","topic":"Niños","lyric":"Hoy, ayer y por los siglos,\nCristo es siempre fiel;\ncambios hay, mas Cristo\nsiempre permanece fiel.\n¡Gloria, pues, a él!\n¡Gloria, pues, a él!\nCambios hay, mas Cristo\nsiempre permanece fiel.","pdf":"","audio":"","video":""},{"id":"corario_ninos_030","bookId":"corario_ninos","number":"30","title":"Aunque en esta vida","type":"Niños","topic":"Niños","lyric":"Aunque en esta vida no tenga riquezas,\nsé que allá en la gloria tengo una mansión. Cual alma perdida entre las pobrezas,\nde mí, Jesucristo tuvo compasión.\nMás allá del sol, más allá del sol,\nyo tengo un hogar, hogar bello hogar,\nmás allá del sol. (bis)","pdf":"","audio":"","video":""},{"id":"corario_ninos_031","bookId":"corario_ninos","number":"31","title":"Solo el poder de Dios","type":"Niños","topic":"Niños","lyric":"Sólo el poder de Dios\npuede cambiar tu ser.\nLa prueba yo te doy:\nÉl me ha cambiado a mí.\n¿No ves que soy feliz\nsiguiendo al Señor?\nNueva criatura soy,\nnueva soy.","pdf":"","audio":"","video":""},{"id":"corario_ninos_032","bookId":"corario_ninos","number":"32","title":"El camino al cielo","type":"Niños","topic":"Niños","lyric":"El camino al cielo es Cristo Jesús,\nél es la Verdad y del mundo es la Luz;\nno hay otro nombre que nos valdrá,\nsólo Jesucristo nos salvará.","pdf":"","audio":"","video":""},{"id":"corario_ninos_033","bookId":"corario_ninos","number":"33","title":"Solamente en Cristo","type":"Niños","topic":"Niños","lyric":"Solamente en Cristo, solamente en él,\nla salvación se encuentra en él.\nNo hay otro nombre dado a los hombres, solamente en Cristo, solamente en él.\nEn San Juan catorce, en el verso seis,\ndice Jesús: \"Soy la Verdad,\nsoy el Camino, también la Vida;\nnadie viene al Padre sino por mí\".","pdf":"","audio":"","video":""},{"id":"corario_ninos_034","bookId":"corario_ninos","number":"34","title":"Dejad a los niños","type":"Niños","topic":"Niños","lyric":"Dejad a los niños venir a Jesús,\nDejad a los niños venir a Jesús.\nY no, y no se lo impidáis,\nporque de los tales\nes el reino de Dios.","pdf":"","audio":"","video":""},{"id":"corario_ninos_035","bookId":"corario_ninos","number":"35","title":"Cual la quietud de un arroyo","type":"Niños","topic":"Niños","lyric":"Cual la quietud de un arroyo\nes la paz que yo siento,\ncuando estoy con mi Jesús.\nEs su amor tan sublime,\nes un gozo indecible,\nque hace feliz mi corazón.\nYo quiero más de mi Cristo,\nmás del Maestro, más de Jesús,\nmás por siempre.\nCual la quietud de un arroyo\nes la paz que yo siento,\ncuando estoy con mi Jesús.","pdf":"","audio":"","video":""},{"id":"corario_ninos_036","bookId":"corario_ninos","number":"36","title":"Cada día con Cristo","type":"Niños","topic":"Niños","lyric":"Cada día con Cristo,\nme llena de perfecta paz;\ncada día con Cristo,\nle amo más y más.\nÉl me salva y guarda\ny sé que pronto volverá,\ny vivir con Cristo\nmás dulce cada día será.","pdf":"","audio":"","video":""},{"id":"corario_ninos_037","bookId":"corario_ninos","number":"37","title":"Lee tu Biblia, ora cada día","type":"Niños","topic":"Niños","lyric":"Lee tu Biblia, ora cada día,\nora cada día,\nora cada día.\nLee tu Biblia, ora cada día,\nsi quieres crecer.\nSi quieres crecer,\nsi quieres crecer.\nLee tu Biblia, ora cada día,\nsi quieres crecer.","pdf":"","audio":"","video":""},{"id":"corario_ninos_038","bookId":"corario_ninos","number":"38","title":"El pan de vida soy","type":"Niños","topic":"Niños","lyric":"\"El pan de vida soy\", dice el Señor.\nVen alma hambrienta ahora al Salvador:\n\"Hambre jamás tendrá quien viene a mí; sed nunca más tendrá quien cree en mí\".","pdf":"","audio":"","video":""},{"id":"corario_ninos_039","bookId":"corario_ninos","number":"39","title":"Quiero cantar una linda canción","type":"Niños","topic":"Niños","lyric":"Quiero cantar una linda canción\nde un Hombre que me transformó.\nQuiero cantar una linda canción\nde Aquel que mi vida cambió.\nFiel Amigo es Jesús, él murió en la cruz;\nÉl es Dios, Salvador, es amor y verdad; sólo en él, encontré esa paz que busqué, sólo en él, encontré la felicidad.\nCuando Jesús a mi vida llegó,\nesa paz y ese gozo me dio;\nquiero que sepas que tú también puedes gozar siempre de su amor.\nSi creyeres en Él, si confiares también,\nsu amor te dará y con Él vivirás.\nComo yo, cantarás esta linda canción\ny el amor del Señor tú compartirás.","pdf":"","audio":"","video":""},{"id":"corario_ninos_040","bookId":"corario_ninos","number":"40","title":"Procura con diligencia","type":"Niños","topic":"Niños","lyric":"Procura con diligencia presentarte a Dios, procura con diligencia presentarte a Dios, aprobado como obrero\nque no tiene de que avergonzarse,\ny que traza bien la palabra de verdad.","pdf":"","audio":"","video":""},{"id":"corario_ninos_041","bookId":"corario_ninos","number":"41","title":"Porqué te afanas hoy","type":"Niños","topic":"Niños","lyric":"¿Por qué te afanas hoy por el mañana?\nTu corazón hoy llenas de pesar.\nSi Dios tiene cuidado de las aves,\nde ti sin duda ha de cuidar.\nConoce tus pruebas,\ntus cargas él lleva.\nSi Dios tiene cuidado de las aves,\nde ti sin duda ha de cuidar.","pdf":"","audio":"","video":""},{"id":"corario_ninos_042","bookId":"corario_ninos","number":"42","title":"Toda la armadura del Señor","type":"Niños","topic":"Niños","lyric":"Toda la armadura del Señor tomad\npara poder vencer.\nCota de justicia y cinto de verdad\ntome cada fiel;\ny del Evangelio vuestros pies calzad,\ny escudo de la fe.\nEspada y yelmo de salud tomad.\n¡Valientes sed!","pdf":"","audio":"","video":""}];
